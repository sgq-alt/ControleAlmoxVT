<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aviamentos por OP - Com Distribuição</title>
    
    <!-- Tailwind CSS para Estilização Premium -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM (Ambiente de Produção Estável) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel para Transpilação do JSX no Navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SDKs do Firebase v9 em Modo de Compatibilidade -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    
    <!-- Lucide Icons para Iconografia Moderna -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.6; }
            100% { transform: scale(0.95); opacity: 1; }
        }
        .pulse-priority {
            animation: pulse-ring 2s infinite ease-in-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Configuração Real do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDE5W2dSh9bdsds_E8_5Cvrr0KE2IOlzpI",
            authDomain: "almoxvt.firebaseapp.com",
            projectId: "almoxvt",
            storageBucket: "almoxvt.firebasestorage.app",
            messagingSenderId: "688995393151",
            appId: "1:688995393151:web:55ef061e6641f376b7294a",
            measurementId: "G-CJRY2BQWRH"
        };
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ACRESCENTE ESTA LINHA AQUI:
const storage = getStorage(app);
        // Opções de status e cores padronizadas por etapa
        const statusOptions = [
            { id: 'pendente', label: 'Pendente (PCP)', sector: 'pcp', color: 'bg-red-100 text-red-800 border-red-200', borderColor: 'border-red-500' },
            { id: 'em_separacao', label: 'Em Separação', sector: 'almoxarifado', color: 'bg-orange-100 text-orange-800 border-orange-200', borderColor: 'border-orange-500' },
            { id: 'aguardando_compra', label: 'Aguardando Compra', sector: 'almoxarifado', color: 'bg-pink-100 text-pink-800 border-pink-200', borderColor: 'border-pink-600' },
            { id: 'parcial', label: 'Parcial (Faltam Itens)', sector: 'almoxarifado', color: 'bg-blue-100 text-blue-800 border-blue-200', borderColor: 'border-blue-500' },
            { id: 'em_distribuicao', label: 'Em Distribuição', sector: 'distribuicao', color: 'bg-purple-100 text-purple-800 border-purple-200', borderColor: 'border-purple-500' },
            { id: 'completo', label: 'Finalizado (Entregue)', sector: 'finalizado', color: 'bg-emerald-100 text-emerald-800 border-emerald-200', borderColor: 'border-emerald-500' }
        ];

        // Mapeamento das colunas do Kanban por Setor/Fase
        const columnsConfig = [
            { id: 'pcp', title: '1. Pendentes/Almoxarifado', color: 'border-slate-300 bg-slate-50', badgeColor: 'bg-slate-200 text-slate-700', statuses: ['pendente'] },
            { id: 'almoxarifado', title: '2. Em separação ou Incompletos', color: 'border-blue-300 bg-blue-50/20', badgeColor: 'bg-blue-100 text-blue-800', statuses: ['em_separacao', 'aguardando_compra', 'parcial'] },
            { id: 'distribuicao', title: '3. Distribuição', color: 'border-purple-300 bg-purple-50/20', badgeColor: 'bg-purple-100 text-purple-800', statuses: ['em_distribuicao'] },
            { id: 'finalizado', title: '4. Finalizados', color: 'border-emerald-300 bg-emerald-50/20', badgeColor: 'bg-emerald-100 text-emerald-800', statuses: ['completo'] }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Falha ao inicializar o Firebase. Ativando contingência offline.", error);
        }

        // Formatação de data amigável
        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime) => {
            const now = new Date();
            const limit = new Date(deadline);
            
            if (completedTime) {
                const comp = new Date(completedTime);
                return comp <= limit ? { status: 'ok', text: 'No Prazo' } : { status: 'late', text: 'Entregue Atrasado' };
            }
            
            if (now > limit) {
                return { status: 'late', text: 'Atrasado' };
            }
            return { status: 'ok', text: 'No Prazo' };
        };

        const App = () => {
            const [ops, setOps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            const [userRole, setUserRole] = useState('pcp'); // 'pcp', 'almoxarifado', 'distribuicao'
            const [dbStatus, setDbStatus] = useState('conectando');
            const [authError, setAuthError] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [permissionDeniedError, setPermissionDeniedError] = useState(false);

            // Estado para o Modal de Histórico de Finalizados
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');
            const [historyDateFilter, setHistoryDateFilter] = useState('all'); // 'all', '7days', '30days'

            // Gerenciamento de Senhas Configuráveis por Setor/Fase
            const [passwords, setPasswords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { pcp: '123456', almoxarifado: '112233', distribuicao: '334455' };
            });

            // Modal de Configuração de Senhas
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [tempPasswords, setTempPasswords] = useState({ pcp: '', almoxarifado: '', distribuicao: '' });

            // Modal de Validação de Senha de Transição de Fase
            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, 
                requiredRole: 'pcp', // 'pcp', 'almoxarifado', 'distribuicao'
                actionType: '', 
                password: '', 
                error: '', 
                actionData: null 
            });

            // Form de criação/edição
            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: ''
            });

            // Checklist do Almoxarifado
            const [newChecklistItem, setNewChecklistItem] = useState('');

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Sincronizar Senhas com localStorage
            const savePasswordsConfig = (newPasses) => {
                setPasswords(newPasses);
                localStorage.setItem('ops_passwords', JSON.stringify(newPasses));
            };

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }

                auth.signInAnonymously()
                    .then(() => {
                        setIsAuthenticated(true);
                        setAuthError(null);
                    })
                    .catch((err) => {
                        console.error("Erro de Autenticação Firebase: ", err);
                        setAuthError(err.message);
                        setDbStatus('offline');
                        loadLocalData();
                    });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;

                setDbStatus('conectando');
                
                const unsubscribe = db.collection('ops_aviamentos')
                    .onSnapshot((snapshot) => {
                        const loadedOps = [];
                        snapshot.forEach(doc => {
                            loadedOps.push({ id: doc.id, ...doc.data() });
                        });
                        setOps(loadedOps);
                        setDbStatus('online');
                        setPermissionDeniedError(false);
                        localStorage.setItem('ops_aviamentos_cache', JSON.stringify(loadedOps));
                    }, (error) => {
                        console.error("Erro ao ler banco de dados Firestore: ", error);
                        if (error.message && (error.message.includes('permissions') || error.code === 'permission-denied')) {
                            setPermissionDeniedError(true);
                        }
                        setDbStatus('offline');
                        loadLocalData();
                    });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) {
                    try {
                        setOps(JSON.parse(cached));
                    } catch (e) {
                        console.error("Erro ao decodificar cache local.", e);
                    }
                }
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(err => {
                            console.error("Erro ao salvar dados na nuvem, aplicando localmente.", err);
                            updateLocalState(updatedOp);
                        });
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                let newOps = [];
                if (exist) {
                    newOps = ops.map(o => o.id === updatedOp.id ? updatedOp : o);
                } else {
                    newOps = [...ops, updatedOp];
                }
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            const getSuggestedSla = () => {
                const date = new Date();
                date.setHours(date.getHours() + 24);
                const tzOffset = date.getTimezoneOffset() * 60000;
                return (new Date(date - tzOffset)).toISOString().slice(0, 16);
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: op.status || 'pendente',
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || ''
                    });
                } else {
                    setEditingOp(null);
                    setFormData({ 
                        opNumber: '', 
                        model: '', 
                        faccaoDestino: '', 
                        status: 'pendente', 
                        notes: '', 
                        slaDeadline: getSuggestedSla(),
                        isPriority: false,
                        pdfBase64: '',
                        pdfName: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingOp(null);
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== "application/pdf") {
                    alert("Apenas arquivos no formato PDF são aceitos!");
                    e.target.value = '';
                    return;
                }

                if (file.size > 800 * 1024) {
                    alert("O arquivo PDF ultrapassou o limite de 800KB. Reduza o tamanho do arquivo.");
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                // Quando o usuário seleciona o PDF no input:
const file = event.target.files[0];

if (file) {
  // Cria uma referência para salvar o arquivo no Storage
  const ref = storage.ref('fichas_tecnicas/' + Date.now() + '_' + file.name);

  // Faz o upload do arquivo
  ref.put(file).then(snapshot => {
    // Pega o link público de acesso ao PDF
    return snapshot.ref.getDownloadURL();
  }).then(url => {
    // Salva o LINK no seu formulário/objeto
    setFormData(prev => ({
      ...prev,
      pdfBase64: url, // Salva a URL para abrir no botão
      pdfName: file.name
    }));
    alert("PDF carregado e salvo com sucesso!");
  }).catch(error => {
    console.error("Erro no upload do PDF:", error);
    alert("Erro ao enviar o PDF.");
  });
}
                    }));
                };
                reader.readAsDataURL(file);
            };

            const triggerPasswordCheck = (requiredRole, actionType, actionData = null) => {
                setPasswordModal({
                    isOpen: true,
                    requiredRole: requiredRole,
                    actionType: actionType,
                    password: '',
                    error: '',
                    actionData: actionData
                });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                const requiredRole = passwordModal.requiredRole;
                const correctPassword = passwords[requiredRole];

                if (passwordModal.password !== correctPassword) {
                    const roleNames = { pcp: 'PCP', almoxarifado: 'Almoxarifado', distribuicao: 'Distribuição' };
                    setPasswordModal(prev => ({ 
                        ...prev, 
                        error: `Senha do setor de ${roleNames[requiredRole]} incorreta!` 
                    }));
                    return;
                }

                const action = passwordModal.actionType;
                const data = passwordModal.actionData;

                setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null });

                if (action === 'delete') {
                    executeDeleteOp(data.id);
                } else if (action === 'allow_edit') {
                    setEditingOp(data);
                    setFormData({
                        opNumber: data.opNumber || '',
                        model: data.model || '',
                        faccaoDestino: data.faccaoDestino || '',
                        status: data.status || 'pendente',
                        notes: data.notes || '',
                        slaDeadline: data.slaDeadline ? data.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: data.isPriority || false,
                        pdfBase64: data.pdfBase64 || '',
                        pdfName: data.pdfName || ''
                    });
                } else if (action === 'save_edit') {
                    executeSaveOp(data);
                } else if (action === 'confirm_separacao') {
                    executeMoveToDistribicao(data);
                } else if (action === 'confirm_distribuicao') {
                    executeMoveToFinalizados(data);
                }
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete()
                        .then(() => handleCloseModal())
                        .catch(err => console.error("Erro ao deletar OP na nuvem: ", err));
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    handleCloseModal();
                }
            };

            // Mover do Almoxarifado -> Distribuição
            const executeMoveToDistribicao = (opToMove) => {
                const updatedOp = {
                    ...opToMove,
                    status: 'em_distribuicao',
                    separationConfirmedAt: new Date().toISOString()
                };
                saveOpToDb(updatedOp);
                handleCloseModal();
            };

            // Mover da Distribuição -> Finalizados
            const executeMoveToFinalizados = (opToMove) => {
                const updatedOp = {
                    ...opToMove,
                    status: 'completo',
                    completedTime: new Date().toISOString()
                };
                saveOpToDb(updatedOp);
                handleCloseModal();
            };

            const handleSaveOp = (e) => {
                e.preventDefault();
                const formattedDeadline = new Date(formData.slaDeadline).toISOString();

                if (editingOp) {
                    if (userRole === 'pcp') {
                        triggerPasswordCheck('pcp', 'save_edit', { ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    } else {
                        executeSaveOp({ ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    }
                } else {
                    // Criar Nova OP exige senha PCP se configurado, ou cria diretamente no setor PCP
                    const newOp = {
                        id: `sol-${Date.now()}`,
                        opNumber: formData.opNumber,
                        model: formData.model,
                        faccaoDestino: formData.faccaoDestino,
                        status: 'pendente',
                        notes: formData.notes,
                        requestTime: new Date().toISOString(),
                        slaDeadline: formattedDeadline,
                        completedTime: null,
                        isPriority: formData.isPriority,
                        pdfBase64: formData.pdfBase64,
                        pdfName: formData.pdfName,
                        items: []
                    };
                    saveOpToDb(newOp);
                    handleCloseModal();
                }
            };

            const executeSaveOp = (opToSave) => {
                let finalOp = { ...opToSave };

                if (opToSave.status === 'completo' && !opToSave.completedTime) {
                    finalOp.completedTime = new Date().toISOString();
                } else if (opToSave.status !== 'completo') {
                    finalOp.completedTime = null;
                }

                saveOpToDb(finalOp);
                handleCloseModal();
            };

            const handleToggleChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = [...(editingOp.items || [])];
                updatedItems[itemIndex].checked = !updatedItems[itemIndex].checked;

                const updatedOp = { ...editingOp, items: updatedItems };
                setEditingOp(updatedOp);
            };

            const handleAddChecklistItem = (e) => {
                if (e) e.preventDefault();
                if (!newChecklistItem.trim() || !editingOp) return;

                const updatedItems = [...(editingOp.items || []), { name: newChecklistItem.trim(), checked: false }];
                const updatedOp = { ...editingOp, items: updatedItems };
                setEditingOp(updatedOp);
                setNewChecklistItem('');
            };

            const handleRemoveChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = (editingOp.items || []).filter((_, i) => i !== itemIndex);
                const updatedOp = { ...editingOp, items: updatedItems };
                setEditingOp(updatedOp);
            };

            // Regra de arquivamento automático após 24 horas de concluído na tela principal
            const isCompletedAndOld = (op) => {
                if (op.status !== 'completo' || !op.completedTime) return false;
                const completedAt = new Date(op.completedTime).getTime();
                const now = new Date().getTime();
                return (now - completedAt) / (1000 * 60 * 60) >= 24; 
            };

            const visibleOps = ops.filter(op => !isCompletedAndOld(op));

            const filteredOps = visibleOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            // Lista de todas as OPs finalizadas (para o modal de histórico)
            const allCompletedOps = ops.filter(op => op.status === 'completo');

            const filteredHistoryOps = allCompletedOps.filter(op => {
                const matchesSearch = 
                    (op.opNumber || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.model || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.faccaoDestino || '').toLowerCase().includes(historySearchTerm.toLowerCase());

                if (!matchesSearch) return false;

                if (historyDateFilter === '7days') {
                    const completedDate = new Date(op.completedTime || op.requestTime);
                    const diffDays = (new Date() - completedDate) / (1000 * 60 * 60 * 24);
                    return diffDays <= 7;
                } else if (historyDateFilter === '30days') {
                    const completedDate = new Date(op.completedTime || op.requestTime);
                    const diffDays = (new Date() - completedDate) / (1000 * 60 * 60 * 24);
                    return diffDays <= 30;
                }

                return true;
            }).sort((a, b) => new Date(b.completedTime || 0) - new Date(a.completedTime || 0));

            // KPIs
            const totalOps = visibleOps.length;
            const completedOps = visibleOps.filter(op => op.status === 'completo').length;
            const inDistribuicaoOps = visibleOps.filter(op => op.status === 'em_distribuicao').length;
            const pendingOps = totalOps - completedOps;
            const lateOps = visibleOps.filter(op => calculateSlaStatus(op.slaDeadline, op.completedTime).status === 'late' && op.status !== 'completo').length;

            const renderCard = (op) => {
                const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                const isLate = sla.status === 'late' && op.status !== 'completo';

                // Encontra a configuração de cor do status correspondente
                const currentStatusObj = statusOptions.find(s => s.id === op.status) || statusOptions[0];

                return (
                    <div 
                        key={op.id} 
                        onClick={() => handleOpenModal(op)}
                        className={`bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer border-2 relative overflow-hidden mb-3 ${currentStatusObj.borderColor} ${
                            op.isPriority 
                            ? 'bg-gradient-to-br from-amber-50/30 to-white shadow-amber-100/50' 
                            : ''
                        }`}
                    >
                        {op.isPriority && (
                            <div className="absolute top-0 left-0 right-0 h-1 bg-amber-400"></div>
                        )}

                        <div className="flex justify-between items-start mb-1.5">
                            <div className="flex items-center gap-1.5 flex-wrap">
                                <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                {op.isPriority && (
                                    <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 py-0.5 rounded flex items-center gap-0.5">
                                        <i data-lucide="zap" className="w-2.5 h-2.5 fill-amber-500 text-amber-500"></i> PRIORITÁRIO
                                    </span>
                                )}
                            </div>
                            
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${
                                isLate 
                                ? 'bg-red-100 text-red-700 animate-pulse' 
                                : op.status === 'completo' 
                                ? 'bg-emerald-100 text-emerald-700' 
                                : op.status === 'em_distribuicao'
                                ? 'bg-purple-100 text-purple-700'
                                : 'bg-slate-100 text-slate-700'
                            }`}>
                                {sla.text}
                            </span>
                        </div>

                        {/* Badge de Status Atual */}
                        <div className="mb-2">
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md border inline-block ${currentStatusObj.color}`}>
                                {currentStatusObj.label}
                            </span>
                        </div>
                        
                        <p className="text-xs font-semibold text-slate-600 mb-1 line-clamp-1">{op.model}</p>
                        
                        <p className="text-[11px] text-slate-500 mb-3 flex items-center gap-1">
                            <i data-lucide="truck" className="w-3 h-3"></i> {op.faccaoDestino || 'Setor Interno'}
                        </p>

                        <div className="text-[10px] text-slate-400 space-y-0.5 border-t border-slate-50 pt-2 mb-2">
                            <div className="flex items-center gap-1">
                                <i data-lucide="calendar" className="w-3 h-3"></i> Solicitado: {formatDateTime(op.requestTime)}
                            </div>
                            <div className="flex items-center gap-1 font-medium text-slate-500">
                                <i data-lucide="alarm-clock" className="w-3 h-3 text-slate-400"></i> Limite: {formatDateTime(op.slaDeadline)}
                            </div>
                        </div>

                                                        </form>
                                                    )}

                                                    <div className="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                                                        {(editingOp.items || []).map((item, index) => (
                                                            <div key={index} className="flex justify-between items-center bg-white p-2 rounded-lg border border-slate-100">
                                                                <label className="flex items-center gap-2 cursor-pointer select-none text-xs flex-1">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        className="w-3.5 h-3.5 rounded text-emerald-600 border-slate-300 focus:ring-emerald-500 cursor-pointer disabled:cursor-not-allowed"
                                                                        checked={item.checked}
                                                                        onChange={() => handleToggleChecklistItem(index)}
                                                                        disabled={userRole !== 'almoxarifado'}
                                                                    />
                                                                    <span className={item.checked ? 'line-through text-slate-400' : 'text-slate-700 font-semibold'}>
                                                                        {item.name}
                                                                    </span>
                                                                </label>
                                                                {userRole === 'almoxarifado' && (
                                                                    <button 
                                                                        type="button"
                                                                        onClick={() => handleRemoveChecklistItem(index)}
                                                                        className="text-red-400 hover:text-red-600 p-1"
                                                                    >
                                                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        ))}
                                                        {(editingOp.items || []).length === 0 && (
                                                            <div className="text-center py-4 text-slate-400 text-xs italic bg-white rounded-lg border border-slate-100">
                                                                Nenhum item cadastrado no checklist.
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </form>
                                </div>
                                
                                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                                    <button type="button" onClick={handleCloseModal} className="px-4 py-2 border border-slate-200 rounded-xl text-slate-700 bg-white hover:bg-slate-100 text-xs font-bold transition-all">Fechar</button>
                                    
                                    <button type="submit" form="opForm" className="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 text-xs font-bold shadow-md shadow-blue-100 flex items-center gap-1.5 transition-all">
                                        <i data-lucide="save" className="w-4 h-4"></i> Salvar Registro
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {/* Modal de Histórico de OPs Finalizadas */}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col h-[85vh]">
                                
                                {/* Cabeçalho do Histórico */}
                                <div className="px-6 py-4 border-b border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-slate-50">
                                    <div>
                                        <h2 className="text-sm font-extrabold text-slate-800 uppercase tracking-wider flex items-center gap-2">
                                            <i data-lucide="archive" className="w-4 h-4 text-emerald-600"></i>
                                            Histórico de Pedidos Finalizados ({allCompletedOps.length})
                                        </h2>
                                        <p className="text-xs text-slate-500 mt-0.5">Consulte OPs concluídas, fichas técnicas e relatórios de entrega</p>
                                    </div>
                                    <button 
                                        onClick={() => setIsHistoryOpen(false)} 
                                        className="p-1 text-slate-400 hover:text-slate-600 transition-colors self-end md:self-auto"
                                    >
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>

                                {/* Barra de Filtro e Pesquisa do Histórico */}
                                <div className="p-4 bg-white border-b border-slate-100 flex flex-col sm:flex-row gap-3 items-center justify-between">
                                    <div className="relative w-full sm:w-80">
                                        <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Procurar por Nº de OP, Modelo, Facção..." 
                                            className="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-emerald-500 outline-none"
                                            value={historySearchTerm}
                                            onChange={(e) => setHistorySearchTerm(e.target.value)}
                                        />
                                    </div>

                                    <div className="flex items-center gap-2 w-full sm:w-auto justify-end">
                                        <span className="text-xs text-slate-500 font-semibold">Período:</span>
                                        <select 
                                            className="p-2 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none bg-slate-50"
                                            value={historyDateFilter}
                                            onChange={(e) => setHistoryDateFilter(e.target.value)}
                                        >
                                            <option value="all">Todo o Histórico</option>
                                            <option value="7days">Últimos 7 Dias</option>
                                            <option value="30days">Últimos 30 Dias</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Listagem do Histórico em Tabela / Cards */}
                                <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                                    {filteredHistoryOps.length > 0 ? (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {filteredHistoryOps.map(op => {
                                                const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                                                return (
                                                    <div 
                                                        key={op.id}
                                                        className="bg-white border border-slate-200 hover:border-emerald-300 rounded-xl p-4 shadow-sm hover:shadow-md transition-all flex flex-col justify-between"
                                                    >
                                                        <div>
                                                            <div className="flex justify-between items-start mb-2">
                                                                <div className="flex items-center gap-2">
                                                                    <span className="font-extrabold text-slate-800 text-sm">{op.opNumber}</span>
                                                                    <span className="text-[10px] bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded-md flex items-center gap-1">
                                                                        <i data-lucide="check-circle-2" className="w-3 h-3"></i> Entregue
                                                                    </span>
                                                                </div>
                                                                <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full ${
                                                                    sla.status === 'ok' ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700'
                                                                }`}>
                                                                    {sla.text}
                                                                </span>
                                                            </div>

                                                            <p className="text-xs font-semibold text-slate-700 mb-1">{op.model}</p>
                                                            <p className="text-xs text-slate-500 mb-3 flex items-center gap-1">
                                                                <i data-lucide="truck" className="w-3.5 h-3.5 text-slate-400"></i> {op.faccaoDestino || 'Setor Interno'}
                                                            </p>

                                                            <div className="bg-slate-50 rounded-lg p-2.5 text-[11px] text-slate-500 space-y-1 mb-3 border border-slate-100">
                                                                <div className="flex justify-between">
                                                                    <span>Solicitado em:</span>
                                                                    <span className="font-semibold text-slate-700">{formatDateTime(op.requestTime)}</span>
                                                                </div>
                                                                <div className="flex justify-between">
                                                                    <span>Entregue em:</span>
                                                                    <span className="font-semibold text-emerald-700">{formatDateTime(op.completedTime)}</span>
                                                                </div>
                                                                {op.notes && (
                                                                    <div className="border-t border-slate-200 pt-1 mt-1 text-[10px] text-slate-600 italic">
                                                                        "{op.notes}"
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div className="flex justify-between items-center border-t border-slate-100 pt-3 mt-2">
                                                            {op.pdfBase64 ? (
                                                                <a 
                                                                    href={op.pdfBase64}
                                                                    target="_blank"
                                                                    rel="noopener noreferrer"
                                                                    className="text-xs text-blue-600 font-bold flex items-center gap-1 hover:underline"
                                                                >
                                                                    <i data-lucide="file-text" className="w-3.5 h-3.5"></i> Ficha Técnica PDF
                                                                </a>
                                                            ) : (
                                                                <span className="text-[10px] text-slate-400 italic">Sem PDF anexado</span>
                                                            )}

                                                            <button 
                                                                onClick={() => {
                                                                    setIsHistoryOpen(false);
                                                                    handleOpenModal(op);
                                                                }}
                                                                className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-lg transition-all flex items-center gap-1"
                                                            >
                                                                <i data-lucide="eye" className="w-3.5 h-3.5"></i> Ver Detalhes
                                                            </button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    ) : (
                                        <div className="text-center py-16 text-slate-400">
                                            <i data-lucide="search-x" className="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
                                            <p className="text-sm font-semibold">Nenhuma OP finalizada encontrada.</p>
                                            <p className="text-xs text-slate-400 mt-1">Tente pesquisar com outro número de OP ou alterar o filtro de data.</p>
                                        </div>
                                    )}
                                </div>

                                {/* Rodapé do Histórico */}
                                <div className="px-6 py-3 border-t border-slate-200 bg-slate-50 flex justify-between items-center text-xs text-slate-500">
                                    <span>Exibindo {filteredHistoryOps.length} de {allCompletedOps.length} OPs finalizadas</span>
                                    <button 
                                        onClick={() => setIsHistoryOpen(false)}
                                        className="px-4 py-1.5 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-900 transition-all"
                                    >
                                        Fechar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal de Validação de Senha */}
                    {passwordModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-200">
                                <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest flex items-center gap-1.5">
                                        <i data-lucide="shield-alert" className="w-4.5 h-4.5 text-blue-600"></i> Autenticação por Senha
                                    </h3>
                                    <button 
                                        onClick={() => setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null })}
                                        className="text-slate-400 hover:text-slate-600"
                                    >
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleVerifyPassword} className="p-5 space-y-4">
                                    <p className="text-xs text-slate-600">
                                        Para confirmar esta ação, digite a senha configurada do setor de <strong className="text-blue-700 uppercase">{
                                            passwordModal.requiredRole === 'pcp' ? 'PCP' : passwordModal.requiredRole === 'almoxarifado' ? 'Almoxarifado' : 'Distribuição'
                                        }</strong>:
                                    </p>
                                    <div>
                                        <input 
                                            type="password" required autoFocus placeholder="Digite a senha do setor..."
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-center text-sm font-bold tracking-widest focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={passwordModal.password}
                                            onChange={e => setPasswordModal({ ...passwordModal, password: e.target.value })}
                                        />
                                    </div>
                                    {passwordModal.error && (
                                        <div className="text-[11px] text-red-600 font-bold bg-red-50 p-2.5 rounded-lg text-center border border-red-100">
                                            {passwordModal.error}
                                        </div>
                                    )}
                                    <div className="flex gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null })}
                                            className="flex-1 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="flex-1 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold"
                                        >
                                            Validar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200">
                                <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest flex items-center gap-1.5">
                                        <i data-lucide="key" className="w-4.5 h-4.5 text-blue-600"></i> Configuração de Senhas por Setor
                                    </h3>
                                    <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <div className="p-5 space-y-4">
                                    <p className="text-xs text-slate-500">
                                        Altere as senhas de liberação do PCP, Almoxarifado e Distribuição conforme necessário:
                                    </p>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Senha PCP / Planejamento</label>
                                        <input 
                                            type="text" required
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={tempPasswords.pcp}
                                            onChange={e => setTempPasswords({ ...tempPasswords, pcp: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Senha Almoxarifado (Separação)</label>
                                        <input 
                                            type="text" required
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={tempPasswords.almoxarifado}
                                            onChange={e => setTempPasswords({ ...tempPasswords, almoxarifado: e.target.value })}
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-purple-900 uppercase mb-1">Senha Distribuição (Entrega)</label>
                                        <input 
                                            type="text" required
                                            className="w-full p-2.5 border border-purple-200 rounded-xl text-sm font-semibold focus:ring-2 focus:ring-purple-500 outline-none bg-purple-50/20"
                                            value={tempPasswords.distribuicao}
                                            onChange={e => setTempPasswords({ ...tempPasswords, distribuicao: e.target.value })}
                                        />
                                    </div>

                                    <div className="flex gap-2 pt-2">
                                        <button 
                                            type="button"
                                            onClick={() => setIsSettingsOpen(false)}
                                            className="flex-1 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={() => {
                                                savePasswordsConfig(tempPasswords);
                                                setIsSettingsOpen(false);
                                            }}
                                            className="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow-md shadow-blue-100"
                                        >
                                            Salvar Senhas
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
