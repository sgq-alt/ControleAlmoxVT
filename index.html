                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Fase / Status *</label>
                                            <select 
                                                className="w-full p-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white disabled:bg-slate-100 disabled:text-slate-400"
                                                value={formData.status} 
                                                onChange={e => setFormData({...formData, status: e.target.value})}
                                                disabled={!canUserEditOp(editingOp)}
                                            >
                                                {allStatusChoices.map(opt => (
                                                    <option key={opt.id} value={opt.id}>{opt.label}</option>
                                                ))}
                                            </select>
                                        </div>

                                        {(userRole === 'pcp' || userRole === 'desenvolvimento') && !editingOp && (
                                            <div className="p-3 bg-slate-50 rounded-xl border border-slate-200">
                                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1 flex items-center gap-1.5">
                                                    <i data-lucide="file-plus" className="w-4 h-4"></i> Anexar PDF da OP / Ficha Técnica (Max 800KB)
                                                </label>
                                                <input 
                                                    type="file" 
                                                    accept=".pdf"
                                                    onChange={handlePdfUpload}
                                                    className="block w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                                                />
                                                {formData.pdfName && (
                                                    <div className="mt-2 text-[11px] text-emerald-600 font-bold flex items-center gap-1">
                                                        <i data-lucide="check-circle-2" className="w-3.5 h-3.5"></i> PDF Pronto: {formData.pdfName}
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        {/* SOLICITAÇÃO 4ª: LOGIN DO PCP PODE ADICIONAR PRIORIDADES */}
                                        {userRole === 'pcp' && (
                                            <div className="flex items-center gap-2 p-3 bg-amber-50 rounded-xl border border-amber-200">
                                                <input 
                                                    type="checkbox" 
                                                    id="priorityCheckbox"
                                                    className="w-4 h-4 text-amber-600 border-amber-300 rounded focus:ring-amber-500 cursor-pointer"
                                                    checked={formData.isPriority}
                                                    onChange={e => setFormData({...formData, isPriority: e.target.checked})}
                                                />
                                                <label htmlFor="priorityCheckbox" className="text-xs font-bold text-amber-900 cursor-pointer flex items-center gap-1 select-none">
                                                    <i data-lucide="zap" className="w-4 h-4 fill-amber-500 text-amber-500"></i> Marcar como PRIORIDADE MÁXIMA (Urgente)
                                                </label>
                                            </div>
                                        )}

                                        {editingOp && editingOp.pdfBase64 && (
                                            <div className="p-3 bg-blue-50 border border-blue-100 rounded-xl flex justify-between items-center">
                                                <div className="text-xs text-blue-800 font-semibold flex items-center gap-1.5">
                                                    <i data-lucide="file-text" className="w-4 h-4"></i> {editingOp.pdfName || "Ficha_Tecnica.pdf"}
                                                </div>
                                                <a 
                                                    href={editingOp.pdfBase64} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer"
                                                    className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold rounded-lg flex items-center gap-1 shadow-sm transition-all"
                                                >
                                                    <i data-lucide="eye" className="w-3.5 h-3.5"></i> Visualizar PDF
                                                </a>
                                            </div>
                                        )}

                                        {editingOp && (
                                            <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-4">
                                                <h4 className="text-xs font-bold text-slate-700 uppercase tracking-wider flex items-center gap-1.5 border-b border-slate-200 pb-2">
                                                    <i data-lucide="sliders" className="w-4 h-4"></i> Painel Operacional / Checklist
                                                </h4>

                                                <div>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Observações / Faltas / Motivos</label>
                                                    <textarea 
                                                        rows="2" placeholder="Descreva observações sobre os aviamentos..."
                                                        className="w-full p-2.5 border border-slate-200 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 outline-none bg-white disabled:bg-slate-100 disabled:text-slate-400"
                                                        value={formData.notes} 
                                                        onChange={e => setFormData({...formData, notes: e.target.value})}
                                                    ></textarea>
                                                </div>

                                                {/* Checklist */}
                                                <div className="border-t border-slate-200 pt-3">
                                                    <label className="block text-xs font-bold text-slate-600 uppercase mb-2">Checklist de Itens</label>
                                                    
                                                    <div className="flex gap-2 mb-3">
                                                        <input 
                                                            type="text" 
                                                            placeholder="Adicionar item (Ex: Zíper 15cm)..."
                                                            className="flex-1 p-2 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-blue-500"
                                                            value={newChecklistItem}
                                                            onChange={e => setNewChecklistItem(e.target.value)}
                                                        />
                                                        <button 
                                                            type="button"
                                                            onClick={handleAddChecklistItem}
                                                            className="bg-slate-800 hover:bg-slate-900 text-white text-xs px-3 rounded-lg font-bold flex items-center gap-1"
                                                        >
                                                            <i data-lucide="plus" className="w-4 h-4"></i> Inserir
                                                        </button>
                                                    </div>

                                                    <div className="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                                                        {(editingOp.items || []).map((item, index) => (
                                                            <div key={index} className="flex justify-between items-center bg-white p-2 rounded-lg border border-slate-100">
                                                                <label className="flex items-center gap-2 cursor-pointer select-none text-xs flex-1">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        className="w-3.5 h-3.5 rounded text-emerald-600 border-slate-300 focus:ring-emerald-500 cursor-pointer"
                                                                        checked={item.checked}
                                                                        onChange={() => handleToggleChecklistItem(index)}
                                                                    />
                                                                    <span className={item.checked ? 'line-through text-slate-400' : 'text-slate-700 font-semibold'}>
                                                                        {item.name}
                                                                    </span>
                                                                </label>
                                                                <button 
                                                                    type="button"
                                                                    onClick={() => handleRemoveChecklistItem(index)}
                                                                    className="text-red-400 hover:text-red-600 p-1"
                                                                >
                                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                                </button>
                                                            </div>
                                                        ))}
                                                        {(editingOp.items || []).length === 0 && (
                                                            <div className="text-center py-3 text-slate-400 text-xs italic bg-white rounded-lg border border-slate-100">
                                                                Nenhum item cadastrado no checklist.
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>

                                                {/* Transições por Senha */}
                                                <div className="border-t border-slate-200 pt-3 space-y-2">
                                                    {userRole === 'almoxarifado' && editingOp.status !== 'em_distribuicao' && editingOp.status !== 'finalizado' && (
                                                        <button 
                                                            type="button"
                                                            onClick={() => triggerPasswordCheck('send_to_distribuicao', editingOp, 'almoxarifado')}
                                                            className="w-full py-2.5 bg-purple-600 hover:bg-purple-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-md shadow-purple-100 transition-all"
                                                        >
                                                            <i data-lucide="truck" className="w-4 h-4"></i> Confirmar Separação e Enviar para Distribuição (Senha Almoxarifado)
                                                        </button>
                                                    )}

                                                    {userRole === 'distribuicao' && editingOp.status === 'em_distribuicao' && (
                                                        <button 
                                                            type="button"
                                                            onClick={() => triggerPasswordCheck('finish_distribuicao', editingOp, 'distribuicao')}
                                                            className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2 shadow-md shadow-emerald-100 transition-all"
                                                        >
                                                            <i data-lucide="check-circle" className="w-4 h-4"></i> Finalizar Entrega / Concluir OP (Senha Distribuição)
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                    </form>
                                </div>
                                
                                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                                    <button type="button" onClick={handleCloseModal} className="px-4 py-2 border border-slate-200 rounded-xl text-slate-700 bg-white hover:bg-slate-100 text-xs font-bold transition-all">Cancelar</button>
                                    
                                    <button type="submit" form="opForm" className="px-4 py-2 bg-blue-600 text-white rounded-xl hover:bg-blue-700 text-xs font-bold shadow-md shadow-blue-100 flex items-center gap-1.5 transition-all">
                                        <i data-lucide="save" className="w-4 h-4"></i> Salvar Alterações
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col h-[85vh]">
                                <div className="px-6 py-4 border-b border-slate-100 bg-emerald-50/50 flex justify-between items-center">
                                    <div className="flex items-center gap-2">
                                        <div className="p-2 bg-emerald-100 text-emerald-800 rounded-xl">
                                            <i data-lucide="history" className="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h2 className="text-sm font-black text-slate-800 uppercase tracking-wider">Histórico de OPs Finalizadas</h2>
                                            <p className="text-xs text-slate-500">Consulta completa de ordens concluídas</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        <button 
                                            onClick={restoreBaseHistory}
                                            className="px-3 py-1.5 bg-white border border-emerald-300 text-emerald-800 hover:bg-emerald-100 rounded-xl text-xs font-bold flex items-center gap-1 shadow-sm transition-all"
                                            title="Recarregar/Restaurar os registros do histórico padrão"
                                        >
                                            <i data-lucide="rotate-ccw" className="w-3.5 h-3.5"></i> Restaurar Dados Base
                                        </button>
                                        <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-slate-600">
                                            <i data-lucide="x" className="w-5 h-5"></i>
                                        </button>
                                    </div>
                                </div>

                                <div className="p-4 border-b border-slate-100 bg-white">
                                    <div className="relative">
                                        <i data-lucide="search" className="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            placeholder="Pesquisar no histórico por número da OP, modelo ou facção..." 
                                            className="w-full pl-9 pr-4 py-2.5 border border-slate-200 rounded-xl text-xs font-semibold focus:ring-2 focus:ring-emerald-500 outline-none"
                                            value={historySearchTerm}
                                            onChange={e => setHistorySearchTerm(e.target.value)}
                                        />
                                    </div>
                                </div>

                                <div className="p-6 overflow-y-auto flex-1 custom-scrollbar">
                                    {filteredHistoryOps.length === 0 ? (
                                        <div className="text-center py-16 text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-2xl">
                                            Nenhuma OP finalizada encontrada no histórico.
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {filteredHistoryOps.map(op => {
                                                const sla = calculateSlaStatus(op.slaDeadline, op.completedTime, op.distributionTime, op.status);
                                                return (
                                                    <div key={op.id} className="bg-white border border-emerald-200 rounded-xl p-4 shadow-sm hover:shadow-md transition-all">
                                                        <div className="flex justify-between items-start mb-2">
                                                            <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                                                sla.status === 'ok' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'
                                                            }`}>
                                                                {sla.text}
                                                            </span>
                                                        </div>
                                                        <p className="text-xs font-semibold text-slate-700 mb-1">{op.model}</p>
                                                        <p className="text-[11px] text-slate-500 mb-2 flex items-center gap-1">
                                                            <i data-lucide="truck" className="w-3.5 h-3.5"></i> {op.faccaoDestino || 'Interno'}
                                                        </p>
                                                        <div className="text-[10px] text-slate-400 space-y-1 border-t border-slate-100 pt-2">
                                                            <div>Solicitado: {formatDateTime(op.requestTime)}</div>
                                                            <div className="font-semibold text-emerald-600">Entregue em: {formatDateTime(op.completedTime)}</div>
                                                        </div>
                                                        {op.pdfBase64 && (
                                                            <div className="mt-3 pt-2 border-t border-slate-50 flex justify-end">
                                                                <a 
                                                                    href={op.pdfBase64} 
                                                                    target="_blank" 
                                                                    rel="noopener noreferrer"
                                                                    className="text-[10px] text-blue-600 font-bold hover:underline flex items-center gap-1"
                                                                >
                                                                    <i data-lucide="file-text" className="w-3 h-3"></i> Visualizar Ficha Técnica
                                                                </a>
                                                            </div>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    {passwordModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-slate-200">
                                <div className="px-5 py-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
                                    <h3 className="text-xs font-black text-slate-800 uppercase tracking-widest flex items-center gap-1.5">
                                        <i data-lucide="shield-alert" className="w-4.5 h-4.5 text-blue-600"></i> Autenticação por Senha
                                    </h3>
                                    <button 
                                        onClick={() => setPasswordModal({ isOpen: false, type: '', targetSector: '', password: '', error: '', actionData: null })}
                                        className="text-slate-400 hover:text-slate-600"
                                    >
                                        <i data-lucide="x" className="w-4 h-4"></i>
                                    </button>
                                </div>
                                <form onSubmit={handleVerifyPassword} className="p-5 space-y-4">
                                    <p className="text-xs text-slate-500">
                                        Digite a senha do setor <strong>{(passwordModal.targetSector || userRole).toUpperCase()}</strong> para autorizar a operação:
                                    </p>
                                    <div>
                                        <input 
                                            type="password" required autoFocus placeholder="Digite a senha..."
                                            className="w-full p-2.5 border border-slate-200 rounded-xl text-center text-sm font-bold tracking-widest focus:ring-2 focus:ring-blue-500 outline-none"
                                            value={passwordModal.password}
                                            onChange={e => setPasswordModal({ ...passwordModal, password: e.target.value })}
                                        />
                                    </div>
                                    {passwordModal.error && (
                                        <div className="text-[10px] text-red-600 font-bold bg-red-50 p-2 rounded-lg text-center border border-red-100">
                                            {passwordModal.error}
                                        </div>
                                    )}
                                    <div className="flex gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => setPasswordModal({ isOpen: false, type: '', targetSector: '', password: '', error: '', actionData: null })}
                                            className="flex-1 py-2 border border-slate-200 rounded-xl text-xs font-bold text-slate-500 hover:bg-slate-50"
                                        >
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit"
                                            className="flex-1 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold shadow-md"
                                        >
                                            Confirmar
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
