<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aviamentos por OP - Com Distribuição e Indicadores</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- SDKs do Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc; 
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuração Real do seu Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDE5W2dSh9bdsds_E8_5Cvrr0KE2IOlzpI",
            authDomain: "almoxvt.firebaseapp.com",
            projectId: "almoxvt",
            storageBucket: "almoxvt.firebasestorage.app",
            messagingSenderId: "688995393151",
            appId: "1:688995393151:web:55ef061e6641f376b7294a",
            measurementId: "G-CJRY2BQWRH"
        };

        const statusOptions = [
            { id: 'pendente', label: 'Pendente (PCP)', sector: 'pcp', color: 'bg-red-100 text-red-800 border-red-200', borderColor: 'border-red-500' },
            { id: 'em_separacao', label: 'Em Separação', sector: 'almoxarifado', color: 'bg-orange-100 text-orange-800 border-orange-200', borderColor: 'border-orange-500' },
            { id: 'aguardando_compra', label: 'Aguardando Compra', sector: 'almoxarifado', color: 'bg-pink-100 text-pink-800 border-pink-200', borderColor: 'border-pink-600' },
            { id: 'parcial', label: 'Parcial (Faltam Itens)', sector: 'almoxarifado', color: 'bg-blue-100 text-blue-800 border-blue-200', borderColor: 'border-blue-500' },
            { id: 'em_distribuicao', label: 'Em Distribuição', sector: 'distribuicao', color: 'bg-purple-100 text-purple-800 border-purple-200', borderColor: 'border-purple-500' },
            { id: 'completo', label: 'Finalizado (Entregue)', sector: 'finalizado', color: 'bg-emerald-100 text-emerald-800 border-emerald-200', borderColor: 'border-emerald-500' }
        ];

        const delayReasons = [
            "Atraso Fornecedor",
            "Falta de Aviamento no Estoque",
            "Erro de Cadastro / PCP",
            "Atraso na Logística / Transporte",
            "Retrabalho / Defeito de Qualidade",
            "Outros"
        ];

        const columnsConfig = [
            { id: 'pcp', title: '1. Pendentes/Almoxarifado', color: 'border-slate-300 bg-slate-50', badgeColor: 'bg-slate-200 text-slate-700', statuses: ['pendente'] },
            { id: 'almoxarifado', title: '2. Em separação ou Incompletos', color: 'border-blue-300 bg-blue-50/20', badgeColor: 'bg-blue-100 text-blue-800', statuses: ['em_separacao', 'aguardando_compra', 'parcial'] },
            { id: 'distribuicao', title: '3. Distribuição', color: 'border-purple-300 bg-purple-50/20', badgeColor: 'bg-purple-100 text-purple-800', statuses: ['em_distribuicao'] },
            { id: 'finalizado', title: '4. Finalizados', color: 'border-emerald-300 bg-emerald-50/20', badgeColor: 'bg-emerald-100 text-emerald-800', statuses: ['completo'] }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Falha ao inicializar o Firebase. Modo offline.", error);
        }

        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime) => {
            const now = new Date();
            const limit = new Date(deadline);
            
            if (completedTime) {
                const comp = new Date(completedTime);
                return comp <= limit ? { status: 'ok', text: 'No Prazo' } : { status: 'late', text: 'Entregue Atrasado' };
            }
            if (now > limit) {
                return { status: 'late', text: 'Atrasado' };
            }
            return { status: 'ok', text: 'No Prazo' };
        };

        const App = () => {
            const [ops, setOps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [currentView, setCurrentView] = useState('kanban'); // 'kanban' | 'indicators'
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            const [userRole, setUserRole] = useState('pcp');
            const [dbStatus, setDbStatus] = useState('conectando');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');
            const [historyDateFilter, setHistoryDateFilter] = useState('all');

            const [passwords, setPasswords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { pcp: '123456', almoxarifado: '112233', distribuicao: '334455' };
            });

            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null 
            });

            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: '', delayReason: ''
            });

            const [newChecklistItem, setNewChecklistItem] = useState('');

            // Atualiza ícones Lucide sempre que trocar de visão ou estado
            useEffect(() => {
                setTimeout(() => {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                }, 50);
            }, [currentView, ops, isModalOpen, isHistoryOpen]);

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }

                auth.signInAnonymously()
                    .then(() => setIsAuthenticated(true))
                    .catch(() => {
                        setDbStatus('offline');
                        loadLocalData();
                    });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;

                setDbStatus('conectando');
                const unsubscribe = db.collection('ops_aviamentos')
                    .onSnapshot((snapshot) => {
                        const loadedOps = [];
                        snapshot.forEach(doc => loadedOps.push({ id: doc.id, ...doc.data() }));
                        setOps(loadedOps);
                        setDbStatus('online');
                        localStorage.setItem('ops_aviamentos_cache', JSON.stringify(loadedOps));
                    }, () => {
                        setDbStatus('offline');
                        loadLocalData();
                    });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) {
                    try { setOps(JSON.parse(cached)); } catch (e) {}
                }
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(() => updateLocalState(updatedOp));
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                let newOps = exist ? ops.map(o => o.id === updatedOp.id ? updatedOp : o) : [...ops, updatedOp];
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            const getSuggestedSla = () => {
                const date = new Date();
                date.setHours(date.getHours() + 24);
                const tzOffset = date.getTimezoneOffset() * 60000;
                return (new Date(date - tzOffset)).toISOString().slice(0, 16);
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: op.status || 'pendente',
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || '',
                        delayReason: op.delayReason || ''
                    });
                } else {
                    setEditingOp(null);
                    setFormData({ 
                        opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: getSuggestedSla(), isPriority: false, pdfBase64: '', pdfName: '', delayReason: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingOp(null);
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.type !== "application/pdf") {
                    alert("Apenas PDF é aceito.");
                    return;
                }
                if (file.size > 800 * 1024) {
                    alert("Tamanho máximo: 800KB.");
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    setFormData(prev => ({ ...prev, pdfBase64: reader.result, pdfName: file.name }));
                };
                reader.readAsDataURL(file);
            };

            const triggerPasswordCheck = (requiredRole, actionType, actionData = null) => {
                setPasswordModal({ isOpen: true, requiredRole, actionType, password: '', error: '', actionData });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                if (passwordModal.password !== passwords[passwordModal.requiredRole]) {
                    setPasswordModal(prev => ({ ...prev, error: `Senha incorreta!` }));
                    return;
                }

                const action = passwordModal.actionType;
                const data = passwordModal.actionData;
                setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null });

                if (action === 'delete') {
                    executeDeleteOp(data.id);
                } else if (action === 'allow_edit') {
                    setEditingOp(data);
                } else if (action === 'save_edit') {
                    executeSaveOp(data);
                } else if (action === 'confirm_separacao') {
                    executeSaveOp({ ...data, status: 'em_distribuicao', separationConfirmedAt: new Date().toISOString() });
                } else if (action === 'confirm_distribuicao') {
                    executeSaveOp({ ...data, status: 'completo', completedTime: new Date().toISOString() });
                }
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete().then(() => handleCloseModal());
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    handleCloseModal();
                }
            };

            const handleSaveOp = (e) => {
                e.preventDefault();
                const formattedDeadline = new Date(formData.slaDeadline).toISOString();

                if (editingOp) {
                    if (userRole === 'pcp') {
                        triggerPasswordCheck('pcp', 'save_edit', { ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    } else {
                        executeSaveOp({ ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    }
                } else {
                    const newOp = {
                        id: `sol-${Date.now()}`,
                        opNumber: formData.opNumber,
                        model: formData.model,
                        faccaoDestino: formData.faccaoDestino,
                        status: 'pendente',
                        notes: formData.notes,
                        requestTime: new Date().toISOString(),
                        slaDeadline: formattedDeadline,
                        completedTime: null,
                        isPriority: formData.isPriority,
                        pdfBase64: formData.pdfBase64,
                        pdfName: formData.pdfName,
                        delayReason: formData.delayReason,
                        items: []
                    };
                    saveOpToDb(newOp);
                    handleCloseModal();
                }
            };

            const executeSaveOp = (opToSave) => {
                let finalOp = { ...opToSave };
                if (opToSave.status === 'completo' && !opToSave.completedTime) {
                    finalOp.completedTime = new Date().toISOString();
                } else if (opToSave.status !== 'completo') {
                    finalOp.completedTime = null;
                }
                saveOpToDb(finalOp);
                handleCloseModal();
            };

            const handleToggleChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = [...(editingOp.items || [])];
                updatedItems[itemIndex].checked = !updatedItems[itemIndex].checked;
                setEditingOp({ ...editingOp, items: updatedItems });
            };

            const handleAddChecklistItem = (e) => {
                if (e) e.preventDefault();
                if (!newChecklistItem.trim() || !editingOp) return;
                const updatedItems = [...(editingOp.items || []), { name: newChecklistItem.trim(), checked: false }];
                setEditingOp({ ...editingOp, items: updatedItems });
                setNewChecklistItem('');
            };

            const isCompletedAndOld = (op) => {
                if (op.status !== 'completo' || !op.completedTime) return false;
                const completedAt = new Date(op.completedTime).getTime();
                const now = new Date().getTime();
                return (now - completedAt) / (1000 * 60 * 60) >= 24; 
            };

            const visibleOps = ops.filter(op => !isCompletedAndOld(op));

            const filteredOps = visibleOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const allCompletedOps = ops.filter(op => op.status === 'completo');

            const filteredHistoryOps = allCompletedOps.filter(op => {
                const matchesSearch = 
                    (op.opNumber || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.model || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.faccaoDestino || '').toLowerCase().includes(historySearchTerm.toLowerCase());

                if (!matchesSearch) return false;
                if (historyDateFilter === '7days') {
                    return (new Date() - new Date(op.completedTime || op.requestTime)) / (1000 * 60 * 60 * 24) <= 7;
                } else if (historyDateFilter === '30days') {
                    return (new Date() - new Date(op.completedTime || op.requestTime)) / (1000 * 60 * 60 * 24) <= 30;
                }
                return true;
            });

            // Cálculo dos Indicadores
            const getDelayReasonStats = () => {
                const allLateOps = ops.filter(op => calculateSlaStatus(op.slaDeadline, op.completedTime).status === 'late');
                const totalLate = allLateOps.length;

                const counts = {};
                delayReasons.forEach(r => counts[r] = 0);
                counts["Não Especificado"] = 0;

                allLateOps.forEach(op => {
                    const reason = op.delayReason || "Não Especificado";
                    counts[reason] = (counts[reason] || 0) + 1;
                });

                return {
                    totalLate,
                    stats: Object.entries(counts)
                        .map(([reason, count]) => ({
                            reason,
                            count,
                            percentage: totalLate > 0 ? ((count / totalLate) * 100).toFixed(1) : 0
                        }))
                        .sort((a, b) => b.count - a.count)
                };
            };

            const delayStats = getDelayReasonStats();

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-100">
                                <i data-lucide="package" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-800 leading-tight">Almoxarifado & Distribuição Flow</h1>
                                <p className="text-xs text-slate-400">Gestão de Aviamentos, Separação e Entrega por OP</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-3 items-center w-full md:w-auto justify-end">
                            {/* Botoes de Troca de Aba */}
                            <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <button 
                                    onClick={() => setCurrentView('kanban')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${currentView === 'kanban' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    <i data-lucide="kanban" className="w-3.5 h-3.5"></i> Quadro Kanban
                                </button>
                                <button 
                                    onClick={() => setCurrentView('indicators')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${currentView === 'indicators' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-800'}`}
                                >
                                    <i data-lucide="pie-chart" className="w-3.5 h-3.5"></i> Indicadores
                                </button>
                            </div>

                            {/* Seletor de Setor */}
                            <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200">
                                <button onClick={() => setUserRole('pcp')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${userRole === 'pcp' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>PCP</button>
                                <button onClick={() => setUserRole('almoxarifado')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${userRole === 'almoxarifado' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-500'}`}>Almoxarifado</button>
                                <button onClick={() => setUserRole('distribuicao')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${userRole === 'distribuicao' ? 'bg-white text-purple-600 shadow-sm' : 'text-slate-500'}`}>Distribuição</button>
                            </div>

                            <button 
                                onClick={() => setIsHistoryOpen(true)}
                                className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-emerald-800 transition-all flex items-center gap-1.5 text-xs font-bold shadow-sm"
                            >
                                <i data-lucide="history" className="w-4 h-4 text-emerald-600"></i> Histórico ({allCompletedOps.length})
                            </button>

                            {currentView === 'kanban' && (
                                <div className="relative w-full md:w-48">
                                    <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                                    <input 
                                        type="text" 
                                        placeholder="Buscar OP..." 
                                        className="pl-9 pr-3 py-1.5 border border-slate-200 bg-slate-50 rounded-lg text-xs focus:ring-2 focus:ring-blue-500 outline-none w-full"
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)}
                                    />
                                </div>
                            )}
                            
                            {userRole === 'pcp' && (
                                <button 
                                    onClick={() => handleOpenModal()}
                                    className="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1 shadow-md shadow-blue-100">
                                    <i data-lucide="plus" className="w-4 h-4"></i> Nova OP
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Visão Kanban */}
                    {currentView === 'kanban' ? (
                        <main className="flex-1 p-6 flex flex-col">
                            <div className="flex-1 overflow-x-auto pb-4 custom-scrollbar">
                                <div className="flex gap-6 h-full items-start min-w-[1280px]">
                                    {columnsConfig.map(col => {
                                        const colOps = filteredOps.filter(op => col.statuses.includes(op.status));

                                        return (
                                            <div key={col.id} className={`w-80 flex flex-col border rounded-2xl h-[calc(100vh-180px)] ${col.color}`}>
                                                <div className="p-3 border-b border-slate-200 flex justify-between items-center bg-white/80 rounded-t-2xl">
                                                    <h3 className="font-bold text-slate-700 text-xs">{col.title}</h3>
                                                    <span className={`text-[10px] py-0.5 px-2 rounded-full font-bold ${col.badgeColor}`}>{colOps.length}</span>
                                                </div>
                                                <div className="p-3 overflow-y-auto flex-1 custom-scrollbar space-y-3">
                                                    {colOps.map(op => {
                                                        const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                                                        const currentStatusObj = statusOptions.find(s => s.id === op.status) || statusOptions[0];

                                                        return (
                                                            <div 
                                                                key={op.id} 
                                                                onClick={() => handleOpenModal(op)}
                                                                className={`bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer border-2 ${currentStatusObj.borderColor}`}
                                                            >
                                                                <div className="flex justify-between items-start mb-1">
                                                                    <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                                                    <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${sla.status === 'late' ? 'bg-red-100 text-red-700' : 'bg-slate-100 text-slate-700'}`}>
                                                                        {sla.text}
                                                                    </span>
                                                                </div>
                                                                <p className="text-xs font-semibold text-slate-600 mb-1">{op.model}</p>
                                                                <p className="text-[11px] text-slate-500 mb-2">{op.faccaoDestino}</p>
                                                                
                                                                {op.delayReason && (
                                                                    <div className="text-[10px] bg-red-50 text-red-700 border border-red-200 px-2 py-1 rounded font-semibold mb-2">
                                                                        Motivo: {op.delayReason}
                                                                    </div>
                                                                )}

                                                                <div className="text-[10px] text-slate-400 border-t pt-2">
                                                                    Limite: {formatDateTime(op.slaDeadline)}
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        </main>
                    ) : (
                        /* Visão de Indicadores por Motivo de Atraso */
                        <main className="flex-1 p-6 max-w-4xl mx-auto w-full">
                            <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-6">
                                <div className="flex justify-between items-center mb-6 border-b pb-4">
                                    <div>
                                        <h2 className="text-base font-extrabold text-slate-800 flex items-center gap-2">
                                            <i data-lucide="bar-chart-2" className="w-5 h-5 text-red-500"></i>
                                            Indicadores de Atraso por Causa Raiz
                                        </h2>
                                        <p className="text-xs text-slate-400 mt-0.5">Distribuição percentual dos motivos de atraso nas OPs</p>
                                    </div>
                                    <div className="bg-red-50 border border-red-100 px-3 py-1.5 rounded-xl text-center">
                                        <span className="text-xs text-red-700 font-bold">Total Atrasados</span>
                                        <p className="text-xl font-black text-red-800">{delayStats.totalLate}</p>
                                    </div>
                                </div>

                                {delayStats.totalLate > 0 ? (
                                    <div className="space-y-4">
                                        {delayStats.stats.map(item => (
                                            <div key={item.reason} className="bg-slate-50 p-4 rounded-xl border border-slate-100">
                                                <div className="flex justify-between items-center text-xs font-bold text-slate-700 mb-1.5">
                                                    <span>{item.reason}</span>
                                                    <span className="text-slate-500">{item.count} OP(s) ({item.percentage}%)</span>
                                                </div>
                                                <div className="w-full bg-slate-200 h-3 rounded-full overflow-hidden">
                                                    <div 
                                                        className="bg-red-500 h-3 rounded-full transition-all duration-500"
                                                        style={{ width: `${item.percentage}%` }}
                                                    ></div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-12 text-slate-400">
                                        <p className="text-sm font-bold text-slate-700">Nenhum atraso registrado no sistema!</p>
                                    </div>
                                )}
                            </div>
                        </main>
                    )}

                    {/* Modal Detalhes OP */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl overflow-hidden">
                                <div className="px-6 py-4 border-b flex justify-between items-center bg-slate-50">
                                    <h2 className="text-sm font-bold text-slate-800">{editingOp ? `OP: ${editingOp.opNumber}` : 'Nova OP'}</h2>
                                    <button onClick={handleCloseModal}><i data-lucide="x" className="w-5 h-5 text-slate-400"></i></button>
                                </div>
                                
                                <form id="opForm" onSubmit={handleSaveOp} className="p-6 space-y-4 max-h-[70vh] overflow-y-auto">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Nº OP</label>
                                            <input type="text" required className="w-full p-2 border rounded-lg text-xs" value={formData.opNumber} onChange={e => setFormData({...formData, opNumber: e.target.value})} disabled={!!editingOp} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Modelo</label>
                                            <input type="text" required className="w-full p-2 border rounded-lg text-xs" value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} disabled={!!editingOp} />
                                        </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Facção Destino</label>
                                            <input type="text" required className="w-full p-2 border rounded-lg text-xs" value={formData.faccaoDestino} onChange={e => setFormData({...formData, faccaoDestino: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Prazo (SLA)</label>
                                            <input type="datetime-local" required className="w-full p-2 border rounded-lg text-xs" value={formData.slaDeadline} onChange={e => setFormData({...formData, slaDeadline: e.target.value})} />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Motivo do Atraso</label>
                                        <select className="w-full p-2 border rounded-lg text-xs bg-white" value={formData.delayReason} onChange={e => setFormData({...formData, delayReason: e.target.value})}>
                                            <option value="">-- Sem Atraso / Não Aplicável --</option>
                                            {delayReasons.map((r, i) => <option key={i} value={r}>{r}</option>)}
                                        </select>
                                    </div>

                                    {editingOp && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Status Interno</label>
                                            <select className="w-full p-2 border rounded-lg text-xs bg-white" value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}>
                                                {statusOptions.map(opt => <option key={opt.id} value={opt.id}>{opt.label}</option>)}
                                            </select>
                                        </div>
                                    )}
                                </form>

                                <div className="px-6 py-4 border-t bg-slate-50 flex justify-end gap-2">
                                    <button type="button" onClick={handleCloseModal} className="px-4 py-2 border rounded-lg text-xs font-bold">Cancelar</button>
                                    <button type="submit" form="opForm" className="px-4 py-2 bg-blue-600 text-white rounded-lg text-xs font-bold">Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
