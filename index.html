<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aviamentos por OP - Com Personalização e Backup</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SheetJS (XLSX) para Exportação Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDE5W2dSh9bdsds_E8_5Cvrr0KE2IOlzpI",
            authDomain: "almoxvt.firebaseapp.com",
            projectId: "almoxvt",
            storageBucket: "almoxvt.firebasestorage.app",
            messagingSenderId: "688995393151",
            appId: "1:688995393151:web:55ef061e6641f376b7294a",
            measurementId: "G-CJRY2BQWRH"
        };

        const defaultColumnsConfig = [
            { id: 'pcp', title: '1. Pendentes/Almoxarifado', color: 'border-slate-300 bg-slate-50', badgeColor: 'bg-slate-200 text-slate-700', statuses: ['pendente'], sector: 'pcp' },
            { id: 'almoxarifado', title: '2. Em separação ou Incompletos', color: 'border-blue-300 bg-blue-50/20', badgeColor: 'bg-blue-100 text-blue-800', statuses: ['em_separacao', 'aguardando_compra', 'parcial'], sector: 'almoxarifado' },
            { id: 'distribuicao', title: '3. Distribuição', color: 'border-purple-300 bg-purple-50/20', badgeColor: 'bg-purple-100 text-purple-800', statuses: ['em_distribuicao'], sector: 'distribuicao' },
            { id: 'finalizado', title: '4. Finalizados', color: 'border-emerald-300 bg-emerald-50/20', badgeColor: 'bg-emerald-100 text-emerald-800', statuses: ['completo'], sector: 'finalizado' }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Firebase offline. Ativando contingência.", error);
        }

        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime) => {
            const now = new Date();
            const limit = new Date(deadline);
            if (completedTime) {
                return new Date(completedTime) <= limit ? { status: 'ok', text: 'No Prazo' } : { status: 'late', text: 'Entregue Atrasado' };
            }
            return now > limit ? { status: 'late', text: 'Atrasado' } : { status: 'ok', text: 'No Prazo' };
        };

        const App = () => {
            const [ops, setOps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            const [userRole, setUserRole] = useState('pcp');
            const [dbStatus, setDbStatus] = useState('conectando');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            // Gerenciador de Colunas/Fases
            const [columns, setColumns] = useState(() => {
                const saved = localStorage.getItem('ops_columns_config');
                return saved ? JSON.parse(saved) : defaultColumnsConfig;
            });
            const [isManageColumnsOpen, setIsManageColumnsOpen] = useState(false);

            // Histórico
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');
            const [historyDateFilter, setHistoryDateFilter] = useState('all');

            // Senhas
            const [passwords, setPasswords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { pcp: '123456', almoxarifado: '112233', distribuicao: '334455' };
            });

            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null 
            });

            // Form de OP
            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: ''
            });

            const [newChecklistItem, setNewChecklistItem] = useState('');

            // Formulário de Nova Fase
            const [newPhaseData, setNewPhaseData] = useState({
                title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: ''
            });

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }
                auth.signInAnonymously()
                    .then(() => setIsAuthenticated(true))
                    .catch(() => { setDbStatus('offline'); loadLocalData(); });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;
                setDbStatus('conectando');
                const unsubscribe = db.collection('ops_aviamentos').onSnapshot((snapshot) => {
                    const loadedOps = [];
                    snapshot.forEach(doc => loadedOps.push({ id: doc.id, ...doc.data() }));
                    setOps(loadedOps);
                    setDbStatus('online');
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(loadedOps));
                }, () => { setDbStatus('offline'); loadLocalData(); });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) setOps(JSON.parse(cached));
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(() => updateLocalState(updatedOp));
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                const newOps = exist ? ops.map(o => o.id === updatedOp.id ? updatedOp : o) : [...ops, updatedOp];
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            // EXPORTAÇÃO EXCEL (Ativas + Finalizadas)
            const handleExportToExcel = () => {
                if (typeof XLSX === 'undefined') {
                    alert("Biblioteca Excel carregando, tente novamente em alguns segundos.");
                    return;
                }

                const dataToExport = ops.map(op => {
                    const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                    const isFinalizada = op.status === 'completo';
                    return {
                        "Número OP": op.opNumber || '',
                        "Modelo / Referência": op.model || '',
                        "Facção Destino": op.faccaoDestino || '',
                        "Situação": isFinalizada ? "Finalizada" : "Ativa",
                        "Status Atual": op.status || '',
                        "Prioridade": op.isPriority ? "SIM" : "Não",
                        "Data Solicitação": formatDateTime(op.requestTime),
                        "Prazo SLA": formatDateTime(op.slaDeadline),
                        "Data Conclusão": formatDateTime(op.completedTime),
                        "Status SLA": sla.text,
                        "Observações": op.notes || '',
                        "Itens Checklist": (op.items || []).map(i => `${i.name} [${i.checked ? 'OK' : 'PENDENTE'}]`).join(' | ')
                    };
                });

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Ordens de Servico");
                XLSX.writeFile(workbook, `Relatorio_OPs_Aviamentos_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            // BACKUP JSON GERAL
            const handleExportBackupJSON = () => {
                const backupPayload = {
                    version: "2.0",
                    exportDate: new Date().toISOString(),
                    columns: columns,
                    passwords: passwords,
                    ops: ops
                };
                const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_Completo_Firebase_OPs_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
            };

            const handleImportBackupJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (!importedData.ops || !Array.isArray(importedData.ops)) {
                            alert("Arquivo de backup inválido!");
                            return;
                        }

                        if (confirm(`Deseja restaurar ${importedData.ops.length} OPs? Isso atualizará seu banco local/nuvem.`)) {
                            setOps(importedData.ops);
                            localStorage.setItem('ops_aviamentos_cache', JSON.stringify(importedData.ops));

                            if (importedData.columns) {
                                setColumns(importedData.columns);
                                localStorage.setItem('ops_columns_config', JSON.stringify(importedData.columns));
                            }

                            if (importedData.passwords) {
                                setPasswords(importedData.passwords);
                                localStorage.setItem('ops_passwords', JSON.stringify(importedData.passwords));
                            }

                            if (dbStatus === 'online' && db) {
                                importedData.ops.forEach(op => db.collection('ops_aviamentos').doc(op.id).set(op));
                            }
                            alert("Restauração concluída com sucesso!");
                        }
                    } catch (err) {
                        alert("Erro ao ler arquivo de backup JSON.");
                    }
                };
                reader.readAsText(file);
            };

            // Adicionar Nova Fase
            const handleAddPhase = (e) => {
                e.preventDefault();
                if (!newPhaseData.title || !newPhaseData.statusId) return;

                const newCol = {
                    id: `col_${Date.now()}`,
                    title: newPhaseData.title,
                    color: newPhaseData.color,
                    badgeColor: 'bg-indigo-100 text-indigo-800',
                    statuses: [newPhaseData.statusId.toLowerCase().replace(/\s+/g, '_')],
                    sector: newPhaseData.sector
                };

                const updatedCols = [...columns, newCol];
                setColumns(updatedCols);
                localStorage.setItem('ops_columns_config', JSON.stringify(updatedCols));

                if (newPhaseData.password) {
                    const newPasses = { ...passwords, [newPhaseData.sector]: newPhaseData.password };
                    setPasswords(newPasses);
                    localStorage.setItem('ops_passwords', JSON.stringify(newPasses));
                }

                setNewPhaseData({ title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: '' });
                alert("Nova fase cadastrada com sucesso!");
            };

            const triggerPasswordCheck = (requiredRole, actionType, actionData = null) => {
                setPasswordModal({
                    isOpen: true,
                    requiredRole: requiredRole,
                    actionType: actionType,
                    password: '',
                    error: '',
                    actionData: actionData
                });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                const requiredRole = passwordModal.requiredRole;
                const correctPassword = passwords[requiredRole] || '123456';

                if (passwordModal.password !== correctPassword) {
                    setPasswordModal(prev => ({ ...prev, error: `Senha do setor incorreta!` }));
                    return;
                }

                const action = passwordModal.actionType;
                const data = passwordModal.actionData;

                setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null });

                if (action === 'delete') executeDeleteOp(data.id);
                else if (action === 'allow_edit') handleOpenModal(data);
                else if (action === 'move_phase') executeMovePhase(data.op, data.nextStatus);
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete().then(() => setIsModalOpen(false));
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    setIsModalOpen(false);
                }
            };

            const executeMovePhase = (opToMove, nextStatus) => {
                const updatedOp = {
                    ...opToMove,
                    status: nextStatus,
                    completedTime: nextStatus === 'completo' ? new Date().toISOString() : opToMove.completedTime
                };
                saveOpToDb(updatedOp);
                setIsModalOpen(false);
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: op.status || 'pendente',
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : '',
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || ''
                    });
                } else {
                    setEditingOp(null);
                    setFormData({ opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: '' });
                }
                setIsModalOpen(true);
            };

            const isCompletedAndOld = (op) => {
                if (op.status !== 'completo' || !op.completedTime) return false;
                return (new Date().getTime() - new Date(op.completedTime).getTime()) / (1000 * 60 * 60) >= 24; 
            };

            const visibleOps = ops.filter(op => !isCompletedAndOld(op));
            const filteredOps = visibleOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const allCompletedOps = ops.filter(op => op.status === 'completo');

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Principal */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-100">
                                <i data-lucide="package" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-800 leading-tight">Almoxarifado & Distribuição Flow</h1>
                                <p className="text-xs text-slate-400">Gestão de Aviamentos e Fases Customizáveis</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2 items-center w-full md:w-auto justify-end">
                            {/* Botão Exportar Excel */}
                            <button 
                                onClick={handleExportToExcel}
                                className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold shadow-md shadow-emerald-100"
                            >
                                <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Exportar Excel
                            </button>

                            {/* Botão Gerenciar Fases */}
                            <button 
                                onClick={() => setIsManageColumnsOpen(true)}
                                className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold"
                            >
                                <i data-lucide="layout" className="w-4 h-4"></i> Personalizar Fases
                            </button>

                            {/* Menu Backup */}
                            <button 
                                onClick={handleExportBackupJSON}
                                className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold"
                                title="Baixar Cópia do Banco de Dados"
                            >
                                <i data-lucide="download" className="w-4 h-4"></i> Backup JSON
                            </button>

                            <label className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold cursor-pointer">
                                <i data-lucide="upload" className="w-4 h-4"></i> Restaurar
                                <input type="file" accept=".json" onChange={handleImportBackupJSON} className="hidden" />
                            </label>

                            {/* Histórico */}
                            <button 
                                onClick={() => setIsHistoryOpen(true)}
                                className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-emerald-800 transition-all flex items-center gap-1.5 text-xs font-bold"
                            >
                                <i data-lucide="history" className="w-4 h-4"></i> Histórico ({allCompletedOps.length})
                            </button>

                            {/* Busca */}
                            <div className="relative w-full md:w-48">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                                <input 
                                    type="text" placeholder="Buscar OP..." 
                                    className="pl-9 pr-4 py-2 border border-slate-200 bg-slate-50 rounded-lg text-xs outline-none w-full"
                                    value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            
                            <button 
                                onClick={() => handleOpenModal()}
                                className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-md shadow-blue-100">
                                <i data-lucide="plus" className="w-4 h-4"></i> Nova OP
                            </button>
                        </div>
                    </header>

                    {/* Kanban Board Dinâmico */}
                    <main className="flex-1 p-6 flex flex-col">
                        <div className="flex-1 overflow-x-auto pb-4 custom-scrollbar">
                            <div className="flex gap-6 h-full items-start min-w-[1280px]">
                                {columns.map(col => {
                                    const colOps = filteredOps.filter(op => col.statuses.includes(op.status));
                                    return (
                                        <div key={col.id} className={`w-80 flex flex-col border rounded-2xl h-[calc(100vh-180px)] min-h-[480px] ${col.color}`}>
                                            <div className="p-3 border-b border-slate-200 flex justify-between items-center bg-white/80 rounded-t-2xl">
                                                <h3 className="font-bold text-slate-700 text-xs">{col.title}</h3>
                                                <span className={`text-[10px] py-0.5 px-2 rounded-full font-bold ${col.badgeColor}`}>{colOps.length}</span>
                                            </div>
                                            <div className="p-3 overflow-y-auto flex-1 custom-scrollbar">
                                                {colOps.map(op => (
                                                    <div key={op.id} onClick={() => handleOpenModal(op)} className="bg-white p-4 rounded-xl shadow-sm border mb-3 cursor-pointer hover:shadow-md">
                                                        <div className="flex justify-between items-start mb-1">
                                                            <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                                            {op.isPriority && <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 rounded">PRIORIDADE</span>}
                                                        </div>
                                                        <p className="text-xs font-semibold text-slate-600">{op.model}</p>
                                                        <p className="text-[11px] text-slate-500 mt-1"><i data-lucide="truck" className="w-3 h-3 inline"></i> {op.faccaoDestino}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {/* Modal Personalizar Fases */}
                    {isManageColumnsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-xl p-6">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Adicionar Nova Fase ao Kanban</h3>
                                    <button onClick={() => setIsManageColumnsOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <form onSubmit={handleAddPhase} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Título da Coluna/Fase *</label>
                                        <input type="text" required placeholder="Ex: 2.5 Conferência de Qualidade" className="w-full p-2 border rounded-xl text-xs" value={newPhaseData.title} onChange={e => setNewPhaseData({...newPhaseData, title: e.target.value})} />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">ID do Status *</label>
                                            <input type="text" required placeholder="Ex: em_conferencia" className="w-full p-2 border rounded-xl text-xs" value={newPhaseData.statusId} onChange={e => setNewPhaseData({...newPhaseData, statusId: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Setor Responsável *</label>
                                            <select className="w-full p-2 border rounded-xl text-xs" value={newPhaseData.sector} onChange={e => setNewPhaseData({...newPhaseData, sector: e.target.value})}>
                                                <option value="pcp">PCP</option>
                                                <option value="almoxarifado">Almoxarifado</option>
                                                <option value="distribuicao">Distribuição</option>
                                                <option value="qualidade">Qualidade</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Senha de Validação do Setor (Opcional)</label>
                                        <input type="password" placeholder="Definir nova senha para esta fase..." className="w-full p-2 border rounded-xl text-xs" value={newPhaseData.password} onChange={e => setNewPhaseData({...newPhaseData, password: e.target.value})} />
                                    </div>
                                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs mt-2">Criar Fase</button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Histórico */}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl p-6 flex flex-col h-[80vh]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Histórico de OPs Finalizadas ({allCompletedOps.length})</h3>
                                    <button onClick={() => setIsHistoryOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <div className="flex justify-between items-center mb-4">
                                    <input type="text" placeholder="Pesquisar..." className="p-2 border rounded-xl text-xs w-64" value={historySearchTerm} onChange={e => setHistorySearchTerm(e.target.value)} />
                                    <button onClick={handleExportToExcel} className="px-3 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-xs"><i data-lucide="file-spreadsheet" className="w-4 h-4 inline"></i> Baixar Excel</button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {allCompletedOps.map(op => (
                                        <div key={op.id} className="p-3 border rounded-xl flex justify-between items-center text-xs">
                                            <div>
                                                <p className="font-bold">{op.opNumber} - {op.model}</p>
                                                <p className="text-slate-500">Destino: {op.faccaoDestino}</p>
                                            </div>
                                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded">Entregue</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
