<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aviamentos por OP - Com Distribuição</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDE5W2dSh9bdsds_E8_5Cvrr0KE2IOlzpI",
            authDomain: "almoxvt.firebaseapp.com",
            projectId: "almoxvt",
            storageBucket: "almoxvt.firebasestorage.app",
            messagingSenderId: "688995393151",
            appId: "1:688995393151:web:55ef061e6641f376b7294a",
            measurementId: "G-CJRY2BQWRH"
        };

        const statusOptions = [
            { id: 'pendente', label: 'Pendente (PCP)', sector: 'pcp', color: 'bg-red-100 text-red-800 border-red-200', borderColor: 'border-red-500' },
            { id: 'em_separacao', label: 'Em Separação', sector: 'almoxarifado', color: 'bg-orange-100 text-orange-800 border-orange-200', borderColor: 'border-orange-500' },
            { id: 'aguardando_compra', label: 'Aguardando Compra', sector: 'almoxarifado', color: 'bg-pink-100 text-pink-800 border-pink-200', borderColor: 'border-pink-600' },
            { id: 'parcial', label: 'Parcial (Faltam Itens)', sector: 'almoxarifado', color: 'bg-blue-100 text-blue-800 border-blue-200', borderColor: 'border-blue-500' },
            { id: 'em_distribuicao', label: 'Em Distribuição', sector: 'distribuicao', color: 'bg-purple-100 text-purple-800 border-purple-200', borderColor: 'border-purple-500' },
            { id: 'completo', label: 'Finalizado (Entregue)', sector: 'finalizado', color: 'bg-emerald-100 text-emerald-800 border-emerald-200', borderColor: 'border-emerald-500' }
        ];

        // Mapeamento das colunas com suporte a todas as variações de status do banco
        const defaultColumnsConfig = [
            { id: 'col_pcp', title: '1. Pendentes/Almoxarifado', color: 'border-slate-300 bg-slate-50', badgeColor: 'bg-slate-200 text-slate-700', statusIds: ['pendente', 'pcp', 'pendentes'], sector: 'pcp' },
            { id: 'col_almox', title: '2. Em separação ou Incompletos', color: 'border-blue-300 bg-blue-50/20', badgeColor: 'bg-blue-100 text-blue-800', statusIds: ['em_separacao', 'separacao', 'aguardando_compra', 'parcial', 'almoxarifado'], sector: 'almoxarifado' },
            { id: 'col_dist', title: '3. Distribuição', color: 'border-purple-300 bg-purple-50/20', badgeColor: 'bg-purple-100 text-purple-800', statusIds: ['em_distribuicao', 'distribuicao'], sector: 'distribuicao' },
            { id: 'col_final', title: '4. Finalizados', color: 'border-emerald-300 bg-emerald-50/20', badgeColor: 'bg-emerald-100 text-emerald-800', statusIds: ['completo', 'finalizado', 'entregue'], sector: 'finalizado' }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Firebase offline. Ativando contingência.", error);
        }

        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime) => {
            const now = new Date();
            const limit = new Date(deadline);
            if (completedTime) {
                return new Date(completedTime) <= limit ? { status: 'ok', text: 'No Prazo' } : { status: 'late', text: 'Entregue Atrasado' };
            }
            return now > limit ? { status: 'late', text: 'Atrasado' } : { status: 'ok', text: 'No Prazo' };
        };

        // Função de normalização para enquadrar status legados de forma garantida
        const normalizeStatus = (rawStatus) => {
            if (!rawStatus) return 'pendente';
            const status = String(rawStatus).toLowerCase().trim();
            if (['pendente', 'pcp', 'pendentes'].includes(status)) return 'pendente';
            if (['em_separacao', 'separacao', 'aguardando_compra', 'parcial', 'almoxarifado'].includes(status)) return status;
            if (['em_distribuicao', 'distribuicao'].includes(status)) return 'em_distribuicao';
            if (['completo', 'finalizado', 'entregue'].includes(status)) return 'completo';
            return 'pendente';
        };

        const App = () => {
            const [ops, setOps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            const [userRole, setUserRole] = useState('pcp');
            const [dbStatus, setDbStatus] = useState('conectando');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            const [columns, setColumns] = useState(() => {
                const saved = localStorage.getItem('ops_columns_config');
                if (!saved) return defaultColumnsConfig;
                try {
                    const parsed = JSON.parse(saved);
                    return parsed.map(c => ({
                        ...c,
                        statusIds: c.statusIds || (c.statusId ? [c.statusId] : ['pendente'])
                    }));
                } catch (e) {
                    return defaultColumnsConfig;
                }
            });

            const [isManageColumnsOpen, setIsManageColumnsOpen] = useState(false);
            const [editingColumn, setEditingColumn] = useState(null);

            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');
            const [historyDateFilter, setHistoryDateFilter] = useState('all');

            const [passwords, setPasswords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { pcp: '123456', almoxarifado: '112233', distribuicao: '334455' };
            });

            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null 
            });

            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: ''
            });

            const [newChecklistItem, setNewChecklistItem] = useState('');

            const [phaseFormData, setPhaseFormData] = useState({
                title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: ''
            });

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }
                auth.signInAnonymously()
                    .then(() => setIsAuthenticated(true))
                    .catch(() => { setDbStatus('offline'); loadLocalData(); });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;
                setDbStatus('conectando');
                const unsubscribe = db.collection('ops_aviamentos').onSnapshot((snapshot) => {
                    const loadedOps = [];
                    snapshot.forEach(doc => loadedOps.push({ id: doc.id, ...doc.data() }));
                    setOps(loadedOps);
                    setDbStatus('online');
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(loadedOps));
                }, () => { setDbStatus('offline'); loadLocalData(); });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) setOps(JSON.parse(cached));
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(() => updateLocalState(updatedOp));
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                const newOps = exist ? ops.map(o => o.id === updatedOp.id ? updatedOp : o) : [...ops, updatedOp];
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            const saveColumnsConfig = (newCols) => {
                setColumns(newCols);
                localStorage.setItem('ops_columns_config', JSON.stringify(newCols));
            };

            const getSuggestedSla = () => {
                const date = new Date();
                date.setHours(date.getHours() + 24);
                const tzOffset = date.getTimezoneOffset() * 60000;
                return (new Date(date - tzOffset)).toISOString().slice(0, 16);
            };

            // EXPORTAÇÃO EXCEL
            const handleExportToExcel = () => {
                if (typeof XLSX === 'undefined') {
                    alert("Biblioteca Excel carregando, aguarde...");
                    return;
                }

                const dataToExport = ops.map(op => {
                    const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                    const isFinalizada = normalizeStatus(op.status) === 'completo';
                    return {
                        "Número OP": op.opNumber || '',
                        "Modelo / Referência": op.model || '',
                        "Facção Destino": op.faccaoDestino || '',
                        "Situação": isFinalizada ? "Finalizada" : "Ativa",
                        "Status Atual": op.status || '',
                        "Prioridade": op.isPriority ? "SIM" : "Não",
                        "Data Solicitação": formatDateTime(op.requestTime),
                        "Prazo SLA": formatDateTime(op.slaDeadline),
                        "Data Conclusão": formatDateTime(op.completedTime),
                        "Status SLA": sla.text,
                        "Observações": op.notes || ''
                    };
                });

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Ordens");
                XLSX.writeFile(workbook, `Relatorio_OPs_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            // BACKUP JSON GERAL
            const handleExportBackupJSON = () => {
                const backupPayload = { version: "2.4", columns, passwords, ops };
                const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_OPs_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
            };

            const handleImportBackupJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (!importedData.ops || !Array.isArray(importedData.ops)) {
                            alert("Arquivo de backup inválido!");
                            return;
                        }

                        if (confirm(`Restaurar ${importedData.ops.length} OPs?`)) {
                            setOps(importedData.ops);
                            localStorage.setItem('ops_aviamentos_cache', JSON.stringify(importedData.ops));
                            if (importedData.columns) saveColumnsConfig(importedData.columns);
                            if (importedData.passwords) {
                                setPasswords(importedData.passwords);
                                localStorage.setItem('ops_passwords', JSON.stringify(importedData.passwords));
                            }
                            if (dbStatus === 'online' && db) {
                                importedData.ops.forEach(op => db.collection('ops_aviamentos').doc(op.id).set(op));
                            }
                            alert("Restauração efetuada com sucesso!");
                        }
                    } catch (err) {
                        alert("Erro ao restaurar backup.");
                    }
                };
                reader.readAsText(file);
            };

            // GESTÃO DE FASES
            const handleMoveColumn = (index, direction) => {
                const newCols = [...columns];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newCols.length) return;

                const temp = newCols[index];
                newCols[index] = newCols[targetIndex];
                newCols[targetIndex] = temp;

                saveColumnsConfig(newCols);
            };

            const handleStartEditColumn = (col) => {
                setEditingColumn(col);
                setPhaseFormData({
                    title: col.title,
                    sector: col.sector || 'almoxarifado',
                    statusId: (col.statusIds || [])[0] || col.id,
                    color: col.color || 'border-indigo-300 bg-indigo-50/20',
                    password: passwords[col.sector] || ''
                });
            };

            const handleSavePhase = (e) => {
                e.preventDefault();
                if (!phaseFormData.title || !phaseFormData.statusId) return;

                const statusFormatted = phaseFormData.statusId.toLowerCase().replace(/\s+/g, '_');

                if (editingColumn) {
                    const updatedCols = columns.map(c => c.id === editingColumn.id ? {
                        ...c,
                        title: phaseFormData.title,
                        statusIds: Array.from(new Set([...(c.statusIds || []), statusFormatted])),
                        sector: phaseFormData.sector,
                        color: phaseFormData.color
                    } : c);
                    saveColumnsConfig(updatedCols);
                    setEditingColumn(null);
                } else {
                    const newCol = {
                        id: `col_${Date.now()}`,
                        title: phaseFormData.title,
                        color: phaseFormData.color,
                        badgeColor: 'bg-indigo-100 text-indigo-800',
                        statusIds: [statusFormatted],
                        sector: phaseFormData.sector
                    };
                    saveColumnsConfig([...columns, newCol]);
                }

                if (phaseFormData.password) {
                    const newPasses = { ...passwords, [phaseFormData.sector]: phaseFormData.password };
                    setPasswords(newPasses);
                    localStorage.setItem('ops_passwords', JSON.stringify(newPasses));
                }

                setPhaseFormData({ title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: '' });
            };

            const handleDeleteColumn = (colId) => {
                if (columns.length <= 1) {
                    alert("Você deve manter pelo menos uma fase no Kanban.");
                    return;
                }
                if (confirm("Tem certeza que deseja excluir esta fase?")) {
                    const updatedCols = columns.filter(c => c.id !== colId);
                    saveColumnsConfig(updatedCols);
                }
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: normalizeStatus(op.status),
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || ''
                    });
                } else {
                    setEditingOp(null);
                    setFormData({ 
                        opNumber: '', 
                        model: '', 
                        faccaoDestino: '', 
                        status: 'pendente', 
                        notes: '', 
                        slaDeadline: getSuggestedSla(),
                        isPriority: false,
                        pdfBase64: '',
                        pdfName: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingOp(null);
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.type !== "application/pdf") {
                    alert("Apenas arquivos PDF são aceitos!");
                    return;
                }
                if (file.size > 800 * 1024) {
                    alert("O arquivo PDF ultrapassou o limite de 800KB.");
                    return;
                }
                const reader = new FileReader();
                reader.onload = () => {
                    setFormData(prev => ({ ...prev, pdfBase64: reader.result, pdfName: file.name }));
                };
                reader.readAsDataURL(file);
            };

            const triggerPasswordCheck = (requiredRole, actionType, actionData = null) => {
                setPasswordModal({
                    isOpen: true,
                    requiredRole: requiredRole,
                    actionType: actionType,
                    password: '',
                    error: '',
                    actionData: actionData
                });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                const requiredRole = passwordModal.requiredRole;
                const correctPassword = passwords[requiredRole] || '123456';

                if (passwordModal.password !== correctPassword) {
                    setPasswordModal(prev => ({ ...prev, error: `Senha do setor incorreta!` }));
                    return;
                }

                const action = passwordModal.actionType;
                const data = passwordModal.actionData;

                setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null });

                if (action === 'delete') executeDeleteOp(data.id);
                else if (action === 'allow_edit') handleOpenModal(data);
                else if (action === 'save_edit') executeSaveOp(data);
                else if (action === 'confirm_separacao') executeMoveToDistribicao(data);
                else if (action === 'confirm_distribuicao') executeMoveToFinalizados(data);
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete().then(() => handleCloseModal());
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    handleCloseModal();
                }
            };

            const executeMoveToDistribicao = (opToMove) => {
                const updatedOp = {
                    ...opToMove,
                    status: 'em_distribuicao',
                    separationConfirmedAt: new Date().toISOString()
                };
                saveOpToDb(updatedOp);
                handleCloseModal();
            };

            const executeMoveToFinalizados = (opToMove) => {
                const updatedOp = {
                    ...opToMove,
                    status: 'completo',
                    completedTime: new Date().toISOString()
                };
                saveOpToDb(updatedOp);
                handleCloseModal();
            };

            const handleSaveOp = (e) => {
                e.preventDefault();
                const formattedDeadline = new Date(formData.slaDeadline).toISOString();

                if (editingOp) {
                    if (userRole === 'pcp') {
                        triggerPasswordCheck('pcp', 'save_edit', { ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    } else {
                        executeSaveOp({ ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    }
                } else {
                    const newOp = {
                        id: `sol-${Date.now()}`,
                        opNumber: formData.opNumber,
                        model: formData.model,
                        faccaoDestino: formData.faccaoDestino,
                        status: 'pendente',
                        notes: formData.notes,
                        requestTime: new Date().toISOString(),
                        slaDeadline: formattedDeadline,
                        completedTime: null,
                        isPriority: formData.isPriority,
                        pdfBase64: formData.pdfBase64,
                        pdfName: formData.pdfName,
                        items: []
                    };
                    saveOpToDb(newOp);
                    handleCloseModal();
                }
            };

            const executeSaveOp = (opToSave) => {
                let finalOp = { ...opToSave };
                if (normalizeStatus(opToSave.status) === 'completo' && !opToSave.completedTime) {
                    finalOp.completedTime = new Date().toISOString();
                } else if (normalizeStatus(opToSave.status) !== 'completo') {
                    finalOp.completedTime = null;
                }
                saveOpToDb(finalOp);
                handleCloseModal();
            };

            const handleToggleChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = [...(editingOp.items || [])];
                updatedItems[itemIndex].checked = !updatedItems[itemIndex].checked;
                setEditingOp({ ...editingOp, items: updatedItems });
            };

            const handleAddChecklistItem = (e) => {
                if (e) e.preventDefault();
                if (!newChecklistItem.trim() || !editingOp) return;
                const updatedItems = [...(editingOp.items || []), { name: newChecklistItem.trim(), checked: false }];
                setEditingOp({ ...editingOp, items: updatedItems });
                setNewChecklistItem('');
            };

            const handleRemoveChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = (editingOp.items || []).filter((_, i) => i !== itemIndex);
                setEditingOp({ ...editingOp, items: updatedItems });
            };

            const isCompletedAndOld = (op) => {
                if (normalizeStatus(op.status) !== 'completo' || !op.completedTime) return false;
                return (new Date().getTime() - new Date(op.completedTime).getTime()) / (1000 * 60 * 60) >= 24; 
            };

            const visibleOps = ops.filter(op => !isCompletedAndOld(op));
            const filteredOps = visibleOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const allCompletedOps = ops.filter(op => normalizeStatus(op.status) === 'completo');

            const filteredHistoryOps = allCompletedOps.filter(op => {
                const matchesSearch = 
                    (op.opNumber || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.model || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                    (op.faccaoDestino || '').toLowerCase().includes(historySearchTerm.toLowerCase());

                if (!matchesSearch) return false;

                if (historyDateFilter === '7days') {
                    const completedDate = new Date(op.completedTime || op.requestTime);
                    return (new Date() - completedDate) / (1000 * 60 * 60 * 24) <= 7;
                } else if (historyDateFilter === '30days') {
                    const completedDate = new Date(op.completedTime || op.requestTime);
                    return (new Date() - completedDate) / (1000 * 60 * 60 * 24) <= 30;
                }
                return true;
            }).sort((a, b) => new Date(b.completedTime || 0) - new Date(a.completedTime || 0));

            // KPIs - Contagem exata conforme solicitado
            const totalOpsAtivas = visibleOps.filter(op => normalizeStatus(op.status) !== 'completo').length;
            const inSeparacaoOps = visibleOps.filter(op => ['em_separacao', 'separacao', 'aguardando_compra', 'parcial', 'almoxarifado'].includes(normalizeStatus(op.status))).length;
            const inDistribuicaoOps = visibleOps.filter(op => normalizeStatus(op.status) === 'em_distribuicao').length;
            const lateOps = visibleOps.filter(op => calculateSlaStatus(op.slaDeadline, op.completedTime).status === 'late' && normalizeStatus(op.status) !== 'completo').length;
            const completedOpsCount = visibleOps.filter(op => normalizeStatus(op.status) === 'completo').length;

            const renderCard = (op) => {
                const normalizedStat = normalizeStatus(op.status);
                const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                const isLate = sla.status === 'late' && normalizedStat !== 'completo';
                const currentStatusObj = statusOptions.find(s => s.id === normalizedStat) || statusOptions[0];

                return (
                    <div 
                        key={op.id} 
                        onClick={() => handleOpenModal(op)}
                        className={`bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer border-2 relative overflow-hidden mb-3 ${currentStatusObj.borderColor} ${

                                                    <div className="space-y-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                                                        {(editingOp.items || []).map((item, index) => (
                                                            <div key={index} className="flex justify-between items-center bg-white p-2 rounded-lg border border-slate-100">
                                                                <label className="flex items-center gap-2 cursor-pointer text-xs flex-1">
                                                                    <input type="checkbox" className="w-3.5 h-3.5 rounded text-emerald-600 border-slate-300 focus:ring-emerald-500" checked={item.checked} onChange={() => handleToggleChecklistItem(index)} disabled={userRole !== 'almoxarifado'} />
                                                                    <span className={item.checked ? 'line-through text-slate-400' : 'text-slate-700 font-semibold'}>{item.name}</span>
                                                                </label>
                                                                {userRole === 'almoxarifado' && (
                                                                    <button type="button" onClick={() => handleRemoveChecklistItem(index)} className="text-red-400 hover:text-red-600 p-1">
                                                                        <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                                                                    </button>
                                                                )}
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </form>
                                </div>
                                
                                <div className="px-6 py-4 border-t border-slate-100 bg-slate-50 flex justify-end gap-3 rounded-b-2xl">
                                    <button type="button" onClick={handleCloseModal} className="px-4 py-2 border border-slate-200 rounded-xl text-slate-700 bg-white text-xs font-bold">Fechar</button>
                                    <button type="submit" form="opForm" className="px-4 py-2 bg-blue-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5">
                                        <i data-lucide="save" className="w-4 h-4"></i> Salvar Registro
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Gerenciador de Fases */}
                    {isManageColumnsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Gerenciador de Fases do Kanban</h3>
                                    <button onClick={() => setIsManageColumnsOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto flex-1">
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-slate-600 uppercase">Fases Atuais</h4>
                                        {columns.map((col, idx) => (
                                            <div key={col.id} className="p-3 border rounded-xl bg-slate-50 flex items-center justify-between gap-2">
                                                <div className="flex-1">
                                                    <p className="font-bold text-xs text-slate-800">{col.title}</p>
                                                    <p className="text-[10px] text-slate-500">Setor: {col.sector}</p>
                                                </div>
                                                <div className="flex items-center gap-1">
                                                    <button onClick={() => handleMoveColumn(idx, -1)} disabled={idx === 0} className="p-1 text-slate-600 disabled:opacity-30"><i data-lucide="arrow-left" className="w-4 h-4"></i></button>
                                                    <button onClick={() => handleMoveColumn(idx, 1)} disabled={idx === columns.length - 1} className="p-1 text-slate-600 disabled:opacity-30"><i data-lucide="arrow-right" className="w-4 h-4"></i></button>
                                                    <button onClick={() => handleStartEditColumn(col)} className="p-1 text-blue-600"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                    <button onClick={() => handleDeleteColumn(col.id)} className="p-1 text-red-600"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <form onSubmit={handleSavePhase} className="space-y-3 bg-slate-50 p-4 border rounded-xl">
                                        <h4 className="text-xs font-bold text-indigo-700 uppercase">{editingColumn ? 'Editar Fase' : 'Criar Nova Fase'}</h4>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Título da Coluna *</label>
                                            <input type="text" required placeholder="Ex: Qualidade" className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.title} onChange={e => setPhaseFormData({...phaseFormData, title: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">ID do Status Interno *</label>
                                            <input type="text" required placeholder="Ex: em_qualidade" className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.statusId} onChange={e => setPhaseFormData({...phaseFormData, statusId: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Setor Responsável *</label>
                                            <select className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.sector} onChange={e => setPhaseFormData({...phaseFormData, sector: e.target.value})}>
                                                <option value="pcp">PCP</option>
                                                <option value="almoxarifado">Almoxarifado</option>
                                                <option value="distribuicao">Distribuição</option>
                                                <option value="qualidade">Qualidade</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Senha de Liberação</label>
                                            <input type="password" placeholder="Digite para alterar..." className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.password} onChange={e => setPhaseFormData({...phaseFormData, password: e.target.value})} />
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            {editingColumn && (
                                                <button type="button" onClick={() => { setEditingColumn(null); setPhaseFormData({ title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: '' }); }} className="flex-1 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Cancelar</button>
                                            )}
                                            <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">{editingColumn ? 'Salvar Fase' : 'Adicionar Fase'}</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Validação de Senha */}
                    {passwordModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 space-y-4 border">
                                <h3 className="text-xs font-extrabold text-slate-800 uppercase">Autenticação por Senha ({passwordModal.requiredRole})</h3>
                                <form onSubmit={handleVerifyPassword} className="space-y-3">
                                    <input type="password" required autoFocus placeholder="Digite a senha do setor..." className="w-full p-2.5 border rounded-xl text-center text-sm font-bold" value={passwordModal.password} onChange={e => setPasswordModal({ ...passwordModal, password: e.target.value })} />
                                    {passwordModal.error && <p className="text-[11px] text-red-600 font-bold text-center">{passwordModal.error}</p>}
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null })} className="flex-1 py-2 border rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">Validar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Histórico */}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl p-6 flex flex-col h-[80vh]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Histórico de OPs Finalizadas ({allCompletedOps.length})</h3>
                                    <button onClick={() => setIsHistoryOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <div className="flex justify-between items-center mb-4">
                                    <input type="text" placeholder="Procurar por Nº de OP, Modelo..." className="p-2 border rounded-xl text-xs w-64" value={historySearchTerm} onChange={e => setHistorySearchTerm(e.target.value)} />
                                    <button onClick={handleExportToExcel} className="px-3 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-xs flex items-center gap-1">
                                        <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Exportar Excel
                                    </button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2 custom-scrollbar">
                                    {filteredHistoryOps.map(op => (
                                        <div key={op.id} className="p-3 border rounded-xl flex justify-between items-center text-xs bg-white">
                                            <div>
                                                <p className="font-bold text-slate-800">{op.opNumber} - {op.model}</p>
                                                <p className="text-slate-500">Destino: {op.faccaoDestino}</p>
                                            </div>
                                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded">Entregue</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
