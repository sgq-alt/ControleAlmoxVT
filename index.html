    <script type="text/babel">
        const { useState, useEffect } = React;

        // Configuração Real do Firebase
        const firebaseConfig = {

        // Opções de Status e Mapeamento de Colunas do Kanban
        const allStatusChoices = [
            { id: 'ofs_nao_programadas', label: 'OFs Não Programadas', colId: 'ofs_nao_programadas' },
            { id: 'sics_desenvolvimento', label: 'SICs Desenvolvimento', colId: 'sics_desenvolvimento' },
            { id: 'ofs_programadas', label: 'OFs Programadas', colId: 'ofs_programadas' },
            { id: 'pendente', label: 'Pendente', colId: 'parcial' },
            { id: 'em_separacao', label: 'Em Separação', colId: 'parcial' },
            { id: 'aguarda_compra', label: 'Aguarda Compra', colId: 'parcial' },
            { id: 'parcial', label: 'Parcial (Faltam Itens)', colId: 'parcial' },
            { id: 'em_distribuicao', label: 'Distribuição', colId: 'em_distribuicao' },
            { id: 'finalizado', label: 'Finalizados (24h)', colId: 'finalizado' }
        ];

        const kanbanColumns = [
            { id: 'ofs_nao_programadas', label: 'OFs Não Programadas', color: 'bg-slate-100 text-slate-800 border-slate-300', borderColor: 'border-slate-500', statusList: ['ofs_nao_programadas'] },
            { id: 'sics_desenvolvimento', label: 'SICs Desenvolvimento', color: 'bg-indigo-100 text-indigo-800 border-indigo-300', borderColor: 'border-indigo-500', statusList: ['sics_desenvolvimento'] },
            { id: 'ofs_programadas', label: 'OFs Programadas', color: 'bg-blue-100 text-blue-800 border-blue-300', borderColor: 'border-blue-500', statusList: ['ofs_programadas'] },
            { id: 'parcial', label: 'Parcial', color: 'bg-amber-100 text-amber-800 border-amber-300', borderColor: 'border-amber-500', statusList: ['pendente', 'em_separacao', 'aguarda_compra', 'parcial'] },
            { id: 'em_distribuicao', label: 'Distribuição', color: 'bg-purple-100 text-purple-800 border-purple-300', borderColor: 'border-purple-500', statusList: ['em_distribuicao'] },
            { id: 'finalizado', label: 'Finalizados (24h)', color: 'bg-emerald-100 text-emerald-800 border-emerald-300', borderColor: 'border-emerald-500', statusList: ['finalizado'] }
        ];

        // Base de Dados do Histórico Inicial (Preservado e Consolidado)
        const initialSampleOps = [
            {
                id: 'sol-hist-101',
                opNumber: 'OP-4001',
                model: 'Camisa Polo Slim Fit',
                faccaoDestino: 'Oficina Costura Silva',
                status: 'finalizado',
                notes: 'Entregue e conferido sem divergências.',
                requestTime: new Date(Date.now() - 72 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() - 48 * 3600 * 1000).toISOString(),
                completedTime: new Date(Date.now() - 50 * 3600 * 1000).toISOString(),
                isPriority: false,
                pdfBase64: '',
                pdfName: '',
                items: [{ name: 'Botões 4 Furos', checked: true }, { name: 'Linha 120 Branca', checked: true }]
            },
            {
                id: 'sol-hist-102',
                opNumber: 'OP-4005',
                model: 'Jaqueta Jeans Oversized',
                faccaoDestino: 'Jeanswear Confecções',
                status: 'finalizado',
                notes: 'Entregue com atraso autorizado pelo PCP.',
                requestTime: new Date(Date.now() - 96 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() - 72 * 3600 * 1000).toISOString(),
                completedTime: new Date(Date.now() - 40 * 3600 * 1000).toISOString(),
                isPriority: true,
                pdfBase64: '',
                pdfName: '',
                items: [{ name: 'Zíper Metal 65cm', checked: true }, { name: 'Rebites Bronze', checked: true }]
            },
            {
                id: 'sol-hist-103',
                opNumber: 'OP-4008',
                model: 'Vestido Midi Linho',
                faccaoDestino: 'Ateliê Elegance',
                status: 'finalizado',
                notes: 'Pedido concluído no prazo.',
                requestTime: new Date(Date.now() - 120 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() - 96 * 3600 * 1000).toISOString(),
                completedTime: new Date(Date.now() - 98 * 3600 * 1000).toISOString(),
                isPriority: false,
                items: [{ name: 'Zíper Invisível 50cm', checked: true }, { name: 'Linha 120 Bege', checked: true }]
            },
            {
                id: 'sol-kanban-101',
                opNumber: 'OF-1002',
                model: 'Camisa Manga Longa Linho',
                faccaoDestino: 'Oficina Central',
                status: 'ofs_nao_programadas',
                notes: 'Aguardando definição de corte.',
                requestTime: new Date(Date.now() - 6 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() + 18 * 3600 * 1000).toISOString(),
                completedTime: null,
                isPriority: false,
                items: [{ name: 'Botões de Madrepérola', checked: false }, { name: 'Entretela Gola', checked: true }]
            },
            {
                id: 'sol-kanban-102',
                opNumber: 'SIC-305',
                model: 'Piloto Calça Jogger Tech',
                faccaoDestino: 'Lab Desenvolvimento',
                status: 'sics_desenvolvimento',
                notes: 'Desenvolvimento de amostra inicial.',
                requestTime: new Date(Date.now() - 3 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() + 21 * 3600 * 1000).toISOString(),
                completedTime: null,
                isPriority: true,
                items: [{ name: 'Elástico 40mm', checked: true }, { name: 'Ponteira de Metal', checked: false }]
            },
            {
                id: 'sol-kanban-103',
                opNumber: 'OP-4012',
                model: 'Camiseta Básica Premium',
                faccaoDestino: 'Facção Estrela',
                status: 'finalizado',
                notes: 'Finalizado recentemente.',
                requestTime: new Date(Date.now() - 12 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() + 12 * 3600 * 1000).toISOString(),
                completedTime: new Date(Date.now() - 4 * 3600 * 1000).toISOString(),
                isPriority: false,
                items: [{ name: 'Gola Ribana', checked: true }, { name: 'Etiqueta de Tamanho M', checked: true }]
            },
            {
                id: 'sol-kanban-104',
                opNumber: 'OP-4015',
                model: 'Blusa Moletom Capuz',
                faccaoDestino: 'Oficina São José',
                status: 'em_distribuicao',
                notes: 'Saída para transporte.',
                requestTime: new Date(Date.now() - 8 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() + 16 * 3600 * 1000).toISOString(),
                completedTime: null,
                isPriority: true,
                items: [{ name: 'Cordão Moletom 1.20m', checked: true }, { name: 'Ilhós Prata', checked: true }]
            },
            {
                id: 'sol-kanban-105',
                opNumber: 'OP-4018',
                model: 'Calça Alfaiataria Feminina',
                faccaoDestino: 'Confecções Modas Elegantes',
                status: 'em_separacao',
                notes: 'Aguardando separação dos botões.',
                requestTime: new Date(Date.now() - 4 * 3600 * 1000).toISOString(),
                slaDeadline: new Date(Date.now() + 20 * 3600 * 1000).toISOString(),
                completedTime: null,
                isPriority: false,
                items: [{ name: 'Botão Social 18mm', checked: false }, { name: 'Zíper Invisível 18cm', checked: true }]
            }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Falha ao inicializar o Firebase. Ativando contingência offline.", error);
        }

        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime, distributionTime, status) => {
            const limit = new Date(deadline);
            // Congela o tempo de avaliação no momento em que enviou para distribuição ou finalizou
            const freezeTime = distributionTime ? new Date(distributionTime) : (completedTime ? new Date(completedTime) : null);
            
            if (freezeTime) {
                return freezeTime <= limit 
                    ? { status: 'ok', text: 'No Prazo' } 
                    : { status: 'late', text: 'Entregue Atrasado' };
            }
            
            if (status === 'em_distribuicao' || status === 'finalizado') {
                return { status: 'ok', text: 'No Prazo' };
            }

            const now = new Date();
            if (now > limit) {
                return { status: 'late', text: 'Atrasado' };
            }
            return { status: 'ok', text: 'No Prazo' };
        };

        const getStatusBorder = (status) => {
            switch(status) {
                case 'ofs_nao_programadas': return 'border-slate-400';
                case 'sics_desenvolvimento': return 'border-indigo-500';
                case 'ofs_programadas': return 'border-blue-500';
                case 'pendente': return 'border-red-500';
                case 'em_separacao': return 'border-orange-500';
                case 'aguarda_compra': return 'border-amber-500';
                case 'parcial': return 'border-amber-500';
                case 'em_distribuicao': return 'border-purple-500';
                case 'finalizado': return 'border-emerald-500';
                default: return 'border-slate-200';
            }
        };

        // Função de mesclagem para garantir que o histórico nunca seja perdido
        const mergeWithInitialOps = (existingArray) => {
            if (!Array.isArray(existingArray)) return [...initialSampleOps];
            const mergedMap = new Map();
            
            // Coloca os itens do histórico padrão primeiro
            initialSampleOps.forEach(op => mergedMap.set(op.id, op));
            // Sobrescreve/adiciona com os dados vindos do banco ou do cache
            existingArray.forEach(op => mergedMap.set(op.id, op));
            
            return Array.from(mergedMap.values());
        };

        const App = () => {
            const [ops, setOps] = useState(() => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return mergeWithInitialOps(parsed);
                        }
                    } catch (e) {
                        console.error("Erro ao ler cache inicial", e);
                    }
                }
                return initialSampleOps;
            });

            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            
            // Perfil do usuário atual: pcp | desenvolvimento | almoxarifado | distribuicao
            const [userRole, setUserRole] = useState('pcp');
            const [dbStatus, setDbStatus] = useState('conectando');
            const [authError, setAuthError] = useState(null);
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            // Modal de Histórico Completo
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');

            // Senhas por setor (Incluso setor Desenvolvimento)
            const [passwords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { 
                    pcp: '123456', 
                    desenvolvimento: '445566', 
                    almoxarifado: '112233', 
                    distribuicao: '334455' 
                };
            });

            // Modal de Validação de Senha de Transição de Fase
            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, 
                type: '', 
                targetSector: '', 
                password: '', 
                error: '', 
                actionData: null 
            });

            // Formulário de OP
            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'ofs_nao_programadas', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: ''
            });

            const [newChecklistItem, setNewChecklistItem] = useState('');

            const handleExportExcel = () => {
                const headers = [
                    "Número da OP",
                    "Modelo",
                    "Facção Destino",
                    "Status Atual",
                    "Data Solicitação",
                    "Prazo SLA",
                    "Data Conclusão",
                    "Status SLA",
                    "Prioridade",
                    "Total Itens Checklist",
                    "Itens Verificados",
                    "Observações"
                ];

                const getStatusLabel = (statusId) => {
                    const found = allStatusChoices.find(s => s.id === statusId);
                    return found ? found.label : statusId;
                };

                const rows = ops.map(op => {
                    const sla = calculateSlaStatus(op.slaDeadline, op.completedTime, op.distributionTime, op.status);
                    const totalItems = op.items ? op.items.length : 0;
                    const checkedItems = op.items ? op.items.filter(i => i.checked).length : 0;

                    return [
                        `"${(op.opNumber || '').replace(/"/g, '""')}"`,
                        `"${(op.model || '').replace(/"/g, '""')}"`,
                        `"${(op.faccaoDestino || '').replace(/"/g, '""')}"`,
                        `"${getStatusLabel(op.status)}"`,
                        `"${formatDateTime(op.requestTime)}"`,
                        `"${formatDateTime(op.slaDeadline)}"`,
                        `"${formatDateTime(op.completedTime)}"`,
                        `"${sla.text}"`,
                        `"${op.isPriority ? 'Sim' : 'Não'}"`,
                        `"${totalItems}"`,
                        `"${checkedItems}"`,
                        `"${(op.notes || '').replace(/"/g, '""').replace(/\n/g, ' ')}"`
                    ];
                });

                const csvContent = "\uFEFF" + [headers.join(";"), ...rows.map(e => e.join(";"))].join("\n");
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                const todayStr = new Date().toISOString().slice(0, 10);
                link.setAttribute("href", url);
                link.setAttribute("download", `indicadores_aviamentos_${todayStr}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }

                auth.signInAnonymously()
                    .then(() => {
                        setIsAuthenticated(true);
                        setAuthError(null);
                    })
                    .catch((err) => {
                        console.error("Erro de Autenticação Firebase: ", err);
                        setAuthError(err.message);
                        setDbStatus('offline');
                        loadLocalData();
                    });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;

                setDbStatus('conectando');
                
                const unsubscribe = db.collection('ops_aviamentos')
                    .onSnapshot((snapshot) => {
                        const loadedOps = [];
                        snapshot.forEach(doc => {
                            loadedOps.push({ id: doc.id, ...doc.data() });
                        });

                        const mergedList = mergeWithInitialOps(loadedOps);
                        setOps(mergedList);
                        setDbStatus('online');
                        localStorage.setItem('ops_aviamentos_cache', JSON.stringify(mergedList));

                        initialSampleOps.forEach(op => {
                            if (!loadedOps.some(doc => doc.id === op.id)) {
                                db.collection('ops_aviamentos').doc(op.id).set(op).catch(() => {});
                            }
                        });
                    }, (error) => {
                        console.error("Erro ao ler banco de dados Firestore: ", error);
                        setDbStatus('offline');
                        loadLocalData();
                    });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) {
                    try {
                        const parsed = JSON.parse(cached);
                        const merged = mergeWithInitialOps(parsed);
                        setOps(merged);
                        localStorage.setItem('ops_aviamentos_cache', JSON.stringify(merged));
                        return;
                    } catch (e) {
                        console.error("Erro ao decodificar cache local.", e);
                    }
                }
                setOps(initialSampleOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(initialSampleOps));
            };

            const restoreBaseHistory = () => {
                const merged = mergeWithInitialOps(ops);
                setOps(merged);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(merged));
                
                if (dbStatus === 'online' && db) {
                    initialSampleOps.forEach(op => {
                        db.collection('ops_aviamentos').doc(op.id).set(op).catch(() => {});
                    });
                }
                alert("Histórico base restaurado com sucesso!");
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(err => {
                            console.error("Erro ao salvar dados na nuvem, salvando localmente.", err);
                            updateLocalState(updatedOp);
                        });
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                let newOps = [];
                if (exist) {
                    newOps = ops.map(o => o.id === updatedOp.id ? updatedOp : o);
                } else {
                    newOps = [...ops, updatedOp];
                }
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            const getSuggestedSla = () => {
                const date = new Date();
                date.setHours(date.getHours() + 24);
                const tzOffset = date.getTimezoneOffset() * 60000;
                return (new Date(date - tzOffset)).toISOString().slice(0, 16);
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: op.status || 'ofs_nao_programadas',
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || ''
                    });
                } else {
                    setEditingOp(null);
                    // Define o status inicial conforme o perfil selecionado ao criar
                    const initialStatus = userRole === 'desenvolvimento' ? 'sics_desenvolvimento' : 'ofs_nao_programadas';
                    setFormData({ 
                        opNumber: '', 
                        model: '', 
                        faccaoDestino: '', 
                        status: initialStatus, 
                        notes: '', 
                        slaDeadline: getSuggestedSla(),
                        isPriority: false,
                        pdfBase64: '',
                        pdfName: ''
                    });
                }
                setIsModalOpen(true);
            };

            const handleCloseModal = () => {
                setIsModalOpen(false);
                setEditingOp(null);
            };

            const handlePdfUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                if (file.type !== "application/pdf") {
                    alert("Apenas arquivos no formato PDF são aceitos!");
                    e.target.value = '';
                    return;
                }

                if (file.size > 800 * 1024) {
                    alert("O arquivo PDF ultrapassou o limite máximo de 800KB.");
                    e.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = () => {
                    setFormData(prev => ({
                        ...prev,
                        pdfBase64: reader.result,
                        pdfName: file.name
                    }));
                };
                reader.readAsDataURL(file);
            };

            const triggerPasswordCheck = (type, actionData = null, targetSector = 'pcp') => {
                setPasswordModal({
                    isOpen: true,
                    type: type,
                    targetSector: targetSector,
                    password: '',
                    error: '',
                    actionData: actionData
                });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                const targetSector = passwordModal.targetSector || userRole;
                const correctPassword = passwords[targetSector] || passwords['pcp'];

                if (passwordModal.password !== correctPassword) {
                    setPasswordModal(prev => ({ 
                        ...prev, 
                        error: `Senha incorreta para o setor ${targetSector.toUpperCase()}!` 
                    }));
                    return;
                }

                const action = passwordModal.type;
                const data = passwordModal.actionData;

                setPasswordModal({ isOpen: false, type: '', targetSector: '', password: '', error: '', actionData: null });

                if (action === 'delete') {
                    executeDeleteOp(data.id);
                } else if (action === 'allow_edit') {
                    setEditingOp(data);
                    setFormData({
                        opNumber: data.opNumber || '',
                        model: data.model || '',
                        faccaoDestino: data.faccaoDestino || '',
                        status: data.status || 'ofs_nao_programadas',
                        notes: data.notes || '',
                        slaDeadline: data.slaDeadline ? data.slaDeadline.slice(0, 16) : getSuggestedSla(),
                        isPriority: data.isPriority || false,
                        pdfBase64: data.pdfBase64 || '',
                        pdfName: data.pdfName || ''
                    });
                } else if (action === 'save_edit') {
                    executeSaveOp(data);
                } else if (action === 'send_to_distribuicao') {
                    executeSaveOp({ ...data, status: 'em_distribuicao', distributionTime: data.distributionTime || new Date().toISOString() });
                } else if (action === 'finish_distribuicao') {
                    executeSaveOp({ ...data, status: 'finalizado', completedTime: new Date().toISOString() });
                }
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete()
                        .then(() => handleCloseModal())
                        .catch(err => console.error("Erro ao deletar OP na nuvem: ", err));
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    handleCloseModal();
                }
            };

            const handleSaveOp = (e) => {
                e.preventDefault();
                const formattedDeadline = new Date(formData.slaDeadline).toISOString();

                if (editingOp) {
                    const sectorRequired = editingOp.status === 'sics_desenvolvimento' ? 'desenvolvimento' : 'pcp';
                    if (userRole === sectorRequired) {
                        triggerPasswordCheck('save_edit', { ...editingOp, ...formData, slaDeadline: formattedDeadline }, sectorRequired);
                    } else {
                        executeSaveOp({ ...editingOp, ...formData, slaDeadline: formattedDeadline });
                    }
                } else {
                    const newOp = {
                        id: `sol-${Date.now()}`,
                        opNumber: formData.opNumber,
                        model: formData.model,
                        faccaoDestino: formData.faccaoDestino,
                        status: formData.status || (userRole === 'desenvolvimento' ? 'sics_desenvolvimento' : 'ofs_nao_programadas'),
                        notes: formData.notes,
                        requestTime: new Date().toISOString(),
                        slaDeadline: formattedDeadline,
                        completedTime: null,
                        isPriority: formData.isPriority,
                        pdfBase64: formData.pdfBase64,
                        pdfName: formData.pdfName,
                        items: []
                    };
                    saveOpToDb(newOp);
                    handleCloseModal();
                }
            };

            const executeSaveOp = (opToSave) => {
                const now = new Date();
                let finalOp = { ...opToSave };

                if (opToSave.status === 'em_distribuicao' && !finalOp.distributionTime) {
                    finalOp.distributionTime = now.toISOString();
                }

                if (opToSave.status === 'finalizado' && !finalOp.completedTime) {
                    finalOp.completedTime = now.toISOString();
                    if (!finalOp.distributionTime) {
                        finalOp.distributionTime = now.toISOString();
                    }
                }

                saveOpToDb(finalOp);
                handleCloseModal();
            };

            const handleToggleChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = [...(editingOp.items || [])];
                updatedItems[itemIndex].checked = !updatedItems[itemIndex].checked;

                const updatedOp = { ...editingOp, items: updatedItems };
                setEditingOp(updatedOp);
                saveOpToDb(updatedOp);
            };

            const handleAddChecklistItem = (e) => {
                e.preventDefault();
                if (!newChecklistItem.trim() || !editingOp) return;

                const updatedItems = [...(editingOp.items || []), { name: newChecklistItem.trim(), checked: false }];
                const updatedOp = { ...editingOp, items: updatedItems };
                
                setEditingOp(updatedOp);
                saveOpToDb(updatedOp);
                setNewChecklistItem('');
            };

            const handleRemoveChecklistItem = (itemIndex) => {
                if (!editingOp) return;
                const updatedItems = (editingOp.items || []).filter((_, idx) => idx !== itemIndex);
                const updatedOp = { ...editingOp, items: updatedItems };
                
                setEditingOp(updatedOp);
                saveOpToDb(updatedOp);
            };

            // Todas as OPs com status 'finalizado' pertencem ao Histórico Completo
            const allCompletedOps = ops.filter(op => op.status === 'finalizado');

            // As OPs do Kanban incluem: não finalizadas + finalizadas nas ÚLTIMAS 24 HORAS
            const activeKanbanOps = ops.filter(op => {
                if (op.status !== 'finalizado') return true;
                if (!op.completedTime) return true;
                const diffMs = new Date() - new Date(op.completedTime);
                return diffMs <= 24 * 60 * 60 * 1000;
            });

            const filteredOps = activeKanbanOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const filteredHistoryOps = allCompletedOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(historySearchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(historySearchTerm.toLowerCase())
            );

            const totalOps = activeKanbanOps.length;
            const nonProgrammedOps = activeKanbanOps.filter(op => op.status === 'ofs_nao_programadas').length;
            const sicsDevOps = activeKanbanOps.filter(op => op.status === 'sics_desenvolvimento').length;
            
            // ATRASADAS: Contabilizado somente até a fase de distribuição (em_distribuicao e finalizado param a contagem)
            const lateOpsPresent = activeKanbanOps.filter(op => {
                if (op.status === 'finalizado' || op.status === 'em_distribuicao') return false;
                const now = new Date();
                const limit = new Date(op.slaDeadline);
                return now > limit;
            }).length;

            // Checa permissão de edição para o perfil atual e para a OP selecionada
            const canUserEditOp = (op) => {
                if (!op) return true;
                if (userRole === 'pcp') return op.status !== 'sics_desenvolvimento';
                if (userRole === 'desenvolvimento') return op.status === 'sics_desenvolvimento';
                if (userRole === 'almoxarifado') return true;
                if (userRole === 'distribuicao') return op.status === 'em_distribuicao';
                return false;
            };

            const renderCard = (op) => {
                const sla = calculateSlaStatus(op.slaDeadline, op.completedTime, op.distributionTime, op.status);
                const isLateNow = (op.status !== 'finalizado' && op.status !== 'em_distribuicao') && new Date() > new Date(op.slaDeadline);
                const borderClass = getStatusBorder(op.status);

                return (
                    <div 
                        key={op.id} 
                        onClick={() => handleOpenModal(op)}
                        className={`bg-white p-4 rounded-xl shadow-sm hover:shadow-md transition-all cursor-pointer border-2 ${borderClass} relative overflow-hidden mb-3`}
                    >
                        {op.isPriority && (
                            <div className="absolute top-0 left-0 right-0 h-1.5 bg-amber-400"></div>
                        )}

                        <div className="flex justify-between items-start mb-2 pt-1">
                            <div className="flex items-center gap-1.5">
                                <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                {op.isPriority && (
                                    <span className="bg-amber-100 text-amber-800 text-[10px] font-extrabold px-1.5 py-0.5 rounded flex items-center gap-0.5">
                                        <i data-lucide="zap" className="w-2.5 h-2.5 fill-amber-500 text-amber-500"></i> URGENTE
                                    </span>
                                )}
                            </div>
                            
                            <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                                isLateNow 
                                ? 'bg-red-100 text-red-700 animate-pulse' 
                                : op.status === 'finalizado'
                                ? 'bg-emerald-100 text-emerald-800'
                                : 'bg-slate-100 text-slate-700'
                            }`}>
                                {sla.text}
                            </span>
                        </div>
                        
                        <p className="text-xs font-semibold text-slate-700 mb-1 line-clamp-1">{op.model}</p>
                        
                        <p className="text-[11px] text-slate-500 mb-2 flex items-center gap-1">
                            <i data-lucide="truck" className="w-3 h-3 text-slate-400"></i> {op.faccaoDestino || 'Setor Interno'}
                        </p>

                        {/* Sub-tag para OPs na coluna Parcial para esclarecer o estágio */}
                        {['pendente', 'em_separacao', 'aguarda_compra', 'parcial'].includes(op.status) && (
                            <div className="mb-2">
                                <span className="bg-slate-100 text-slate-600 border border-slate-200 text-[9px] font-extrabold px-2 py-0.5 rounded uppercase">
                                    Sub-fase: {
                                        op.status === 'pendente' ? 'Pendente' :
                                        op.status === 'em_separacao' ? 'Em Separação' :
                                        op.status === 'aguarda_compra' ? 'Aguarda Compra' : 'Parcial'
                                    }
                                </span>
                            </div>
                        )}

                        <div className="text-[10px] text-slate-400 space-y-0.5 border-t border-slate-100 pt-2 mb-2">
                            <div className="flex items-center gap-1">
                                <i data-lucide="calendar" className="w-3 h-3"></i> Solicitado: {formatDateTime(op.requestTime)}
                            </div>
                            {op.status === 'finalizado' ? (
                                <div className="flex items-center gap-1 font-semibold text-emerald-600">
                                    <i data-lucide="check-circle" className="w-3 h-3"></i> Entregue: {formatDateTime(op.completedTime)}
                                </div>
                            ) : (
                                <div className="flex items-center gap-1 font-semibold text-slate-600">
                                    <i data-lucide="alarm-clock" className="w-3 h-3 text-slate-400"></i> Limite: {formatDateTime(op.slaDeadline)}
                                </div>
                            )}
                        </div>

                        {op.pdfBase64 && (
                            <div className="mt-1 mb-2 inline-flex items-center gap-1 text-[10px] text-blue-600 font-bold bg-blue-50 px-2 py-0.5 rounded">
                                <i data-lucide="file-text" className="w-3 h-3"></i> PDF Anexo
                            </div>

                        {op.items && op.items.length > 0 && (

                                <div className="flex justify-between text-[10px] text-slate-500 mb-1 font-medium">
                                    <span>Checklist Aviamento</span>
                                    <span className="font-bold">{op.items.filter(i => i.checked).length}/{op.items.length}</span>
                                </div>
                                <div className="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">
                                    <div 
                                        className="bg-emerald-500 h-1.5 transition-all duration-300" 
                                        style={{ width: `${(op.items.filter(i => i.checked).length / op.items.length) * 100}%` }}
                                    ></div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="min-h-screen flex flex-col">
                    
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">

                                <i data-lucide="package" className="w-6 h-6"></i>

                        </div>

                        <div className="flex flex-wrap gap-3 items-center w-full md:w-auto justify-end">
                            {/* Selector de Perfil Atualizado com setor 'Desenvolvimento' */}
                            <div className="flex items-center bg-slate-100 p-1 rounded-xl border border-slate-200 text-xs font-bold">
                                <button 
                                    onClick={() => setUserRole('pcp')}
                                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${userRole === 'pcp' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500'}`}
                                >
                                    <i data-lucide="layers" className="w-3.5 h-3.5"></i> PCP
                                </button>
                                <button 
                                    onClick={() => setUserRole('desenvolvimento')}
                                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${userRole === 'desenvolvimento' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-500'}`}
                                >
                                    <i data-lucide="flask-conical" className="w-3.5 h-3.5"></i> Desenvolvimento
                                </button>
                                <button 
                                    onClick={() => setUserRole('almoxarifado')}
                                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${userRole === 'almoxarifado' ? 'bg-white shadow-sm text-amber-600' : 'text-slate-500'}`}
                                >
                                    <i data-lucide="boxes" className="w-3.5 h-3.5"></i> Almoxarifado
                                </button>
                                <button 
                                    onClick={() => setUserRole('distribuicao')}
                                    className={`px-3 py-1.5 rounded-lg transition-all flex items-center gap-1 ${userRole === 'distribuicao' ? 'bg-white shadow-sm text-purple-600' : 'text-slate-500'}`}
                                >
                                    <i data-lucide="truck" className="w-3.5 h-3.5"></i> Distribuição
                                </button>
                            </div>

                            {/* Botão do Histórico de Ordens Finalizadas */}
                            <button 
                                onClick={() => setIsHistoryOpen(true)}
                                className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-emerald-800 transition-all flex items-center gap-1.5 text-xs font-bold shadow-sm"
                                title="Consultar Histórico Completo de OPs Finalizadas"
                            >
                                <i data-lucide="history" className="w-4 h-4 text-emerald-600"></i> 
                                <span>Histórico ({allCompletedOps.length})</span>
                            </button>

                            {/* Botão Exportar para Excel / Indicadores */}
                            <button 
                                onClick={handleExportExcel}
                                className="px-3 py-2 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold shadow-sm"
                                title="Exportar dados em formato compatível com Excel para criação de relatórios e indicadores"
                            >
                                <i data-lucide="download" className="w-4 h-4 text-slate-600"></i> 
                                <span>Exportar Excel</span>
                            </button>

                            <div className="relative w-full md:w-56">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                                <input 
                                    type="text" 
                                    placeholder="Buscar OP, Modelo..." 
                                    className="pl-9 pr-4 py-2 border border-slate-200 bg-slate-50 rounded-xl text-xs focus:ring-2 focus:ring-blue-500 focus:bg-white outline-none w-full"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            
                            {(userRole === 'pcp' || userRole === 'desenvolvimento') && (
                                <button 
                                    onClick={() => handleOpenModal()}
                                    className={`${userRole === 'desenvolvimento' ? 'bg-indigo-600 hover:bg-indigo-700 shadow-indigo-100' : 'bg-blue-600 hover:bg-blue-700 shadow-blue-100'} text-white px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-md`}
                                >
                                    <i data-lucide="plus" className="w-4 h-4"></i> {userRole === 'desenvolvimento' ? 'Nova SIC' : 'Nova OP'}
                                </button>
                            )}
                        </div>
                    </header>

                    {}
                    <main className="flex-1 p-6 flex flex-col">
                        <div className="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-blue-50 rounded-xl text-blue-600"><i data-lucide="file-text" className="w-5 h-5"></i></div>
                                <div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Ativas no Kanban</p><p className="text-xl font-extrabold text-slate-800">{totalOps}</p></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-slate-100 rounded-xl text-slate-700"><i data-lucide="clock" className="w-5 h-5"></i></div>
                                <div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">OFs Não Programadas</p><p className="text-xl font-extrabold text-slate-800">{nonProgrammedOps}</p></div>
                            </div>
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-indigo-50 rounded-xl text-indigo-600"><i data-lucide="flask-conical" className="w-5 h-5"></i></div>
                                <div><p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">SICs Desenvolvimento</p><p className="text-xl font-extrabold text-slate-800">{sicsDevOps}</p></div>
                            </div>
                            {/* SOLICITAÇÃO 1ª: KPI DE ATRASADAS MOSTRA SOMENTE O QUE ESTÁ ATRASADO NO MOMENTO PRESENTE */}
                            <div className="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex items-center gap-4">
                                <div className="p-3 bg-red-50 rounded-xl text-red-600"><i data-lucide="alert-octagon" className="w-5 h-5"></i></div>
                                <div>
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Atrasadas Agora</p>
                                    <p className="text-xl font-extrabold text-red-600">{lateOpsPresent}</p>
                                </div>
                            </div>
                        </div>

                        {}
                        <div className="flex-1 overflow-x-auto pb-4 custom-scrollbar">
                            <div className="flex gap-5 h-full items-start min-w-[1600px]">
                                {kanbanColumns.map(column => {
                                    const colOps = filteredOps
                                        .filter(op => column.statusList.includes(op.status))
                                        .sort((a, b) => {
                                            if (a.isPriority && !b.isPriority) return -1;
                                            if (!a.isPriority && b.isPriority) return 1;
                                            return new Date(a.slaDeadline) - new Date(b.slaDeadline);
                                        });

                                    return (
                                        <div key={column.id} className="w-72 flex flex-col bg-slate-50 border border-slate-200 rounded-2xl h-[calc(100vh-270px)] min-h-[450px]">
                                            <div className="p-3 border-b border-slate-200 flex justify-between items-center bg-white rounded-t-2xl">
                                                <h3 className="font-bold text-slate-700 text-xs flex items-center gap-2">
                                                    <span className={`w-3 h-3 rounded-full border-2 ${column.borderColor} ${column.color.split(' ')[0]}`}></span>
                                                    {column.label}
                                                </h3>
                                                <span className="bg-slate-100 text-slate-600 text-[10px] py-0.5 px-2 rounded-full font-bold">{colOps.length}</span>
                                            </div>
                                            <div className="p-3 overflow-y-auto flex-1 custom-scrollbar">
                                                {colOps.map(op => renderCard(op))}
                                                {colOps.length === 0 && (
                                                    <div className="text-center py-12 text-slate-400 text-xs border-2 border-dashed border-slate-200 rounded-xl bg-white/50">

                                                    </div>

                                            </div>
                                        </div>
                                    );
                                })}

                    <footer className="bg-white border-t border-slate-200 px-6 py-3 flex justify-between items-center text-xs text-slate-400">
                        <div className="flex items-center gap-2">
                            <span className={`w-2.5 h-2.5 rounded-full ${dbStatus === 'online' ? 'bg-emerald-500' : 'bg-amber-500'}`}></span>
                            <span className="font-semibold text-slate-500">
                                {dbStatus === 'online' ? 'Nuvem Conectada' : 'Modo Contingência (Local)'}
                            </span>
                        </div>
                        <span className="font-bold text-slate-500 uppercase">Perfil Ativo: {userRole}</span>
                    </footer>

                    {}
                    {isModalOpen && (

                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                                    <h2 className="text-xs font-black text-slate-800 uppercase tracking-wider flex items-center gap-2">
                                        <i data-lucide="edit-3" className="w-4 h-4 text-blue-600"></i>
                                        {editingOp ? `Gerenciar OP: ${editingOp.opNumber}` : 'Nova Solicitação de OP'}
                                    </h2>
                                    <button onClick={handleCloseModal} className="text-slate-400 hover:text-slate-600">
                                        <i data-lucide="x" className="w-5 h-5"></i>
                                    </button>
                                </div>
                                
                                <div className="p-6 overflow-y-auto flex-1 space-y-5">
                                    
                                    {editingOp && (userRole === 'pcp' || userRole === 'desenvolvimento') && (
                                        <div className="flex justify-between items-center p-3 bg-red-50 border border-red-100 rounded-xl">
                                            <div className="text-xs text-red-800 font-medium">
                                                Ações Administrativas do Setor ({userRole.toUpperCase()})
                                            </div>
                                            <div className="flex gap-2">
                                                <button 
                                                    type="button"
                                                    onClick={() => triggerPasswordCheck('allow_edit', editingOp, userRole)}
                                                    className="px-3 py-1.5 bg-white border border-red-200 text-red-700 text-xs font-bold rounded-lg hover:bg-red-100 flex items-center gap-1"

                                                    <i data-lucide="lock" className="w-3.5 h-3.5"></i> Liberar Edição

                                                <button

                                                    onClick={() => triggerPasswordCheck('delete', editingOp, userRole)}
                                                    className="px-3 py-1.5 bg-red-600 text-white text-xs font-bold rounded-lg hover:bg-red-700 flex items-center gap-1 shadow-sm"
                                                >
                                                    <i data-lucide="trash-2" className="w-3.5 h-3.5"></i> Excluir OP
                                                </button>
                                            </div>
                                        </div>
                                    )}

                                    <form id="opForm" onSubmit={handleSaveOp} className="space-y-4">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Número da OP *</label>
                                                <input 
                                                    type="text" required placeholder="Ex: OP-4780 ou SIC-101"

                                            </div>
