<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Aviamentos por OP - Gestão Avançada e Compatível</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase v9 Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- SheetJS (XLSX) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const firebaseConfig = {
            apiKey: "AIzaSyDE5W2dSh9bdsds_E8_5Cvrr0KE2IOlzpI",
            authDomain: "almoxvt.firebaseapp.com",
            projectId: "almoxvt",
            storageBucket: "almoxvt.firebasestorage.app",
            messagingSenderId: "688995393151",
            appId: "1:688995393151:web:55ef061e6641f376b7294a",
            measurementId: "G-CJRY2BQWRH"
        };

        // Mapeamento compatível que preserva tanto os status legados quanto os novos
        const defaultColumnsConfig = [
            { id: 'col_pcp', title: '1. PCP / Pendentes', color: 'border-slate-300 bg-slate-50', badgeColor: 'bg-slate-200 text-slate-700', statusIds: ['pendente'], sector: 'pcp' },
            { id: 'col_almox', title: '2. Em Separação / Incompletos', color: 'border-blue-300 bg-blue-50/20', badgeColor: 'bg-blue-100 text-blue-800', statusIds: ['em_separacao', 'aguardando_compra', 'parcial'], sector: 'almoxarifado' },
            { id: 'col_dist', title: '3. Distribuição / Entrega', color: 'border-purple-300 bg-purple-50/20', badgeColor: 'bg-purple-100 text-purple-800', statusIds: ['em_distribuicao'], sector: 'distribuicao' },
            { id: 'col_final', title: '4. Finalizados / Entregue', color: 'border-emerald-300 bg-emerald-50/20', badgeColor: 'bg-emerald-100 text-emerald-800', statusIds: ['completo'], sector: 'finalizado' }
        ];

        let db = null;
        let auth = null;
        let firebaseOnline = false;

        try {
            if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
            firebaseOnline = true;
        } catch (error) {
            console.warn("Firebase offline. Ativando contingência.", error);
        }

        const formatDateTime = (dateString) => {
            if (!dateString) return '--';
            const date = new Date(dateString);
            return date.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
        };

        const calculateSlaStatus = (deadline, completedTime) => {
            const now = new Date();
            const limit = new Date(deadline);
            if (completedTime) {
                return new Date(completedTime) <= limit ? { status: 'ok', text: 'No Prazo' } : { status: 'late', text: 'Entregue Atrasado' };
            }
            return now > limit ? { status: 'late', text: 'Atrasado' } : { status: 'ok', text: 'No Prazo' };
        };

        const App = () => {
            const [ops, setOps] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingOp, setEditingOp] = useState(null);
            const [dbStatus, setDbStatus] = useState('conectando');
            const [isAuthenticated, setIsAuthenticated] = useState(false);

            // Gerenciador de Colunas com suporte a múltiplos status
            const [columns, setColumns] = useState(() => {
                const saved = localStorage.getItem('ops_columns_config');
                if (!saved) return defaultColumnsConfig;
                try {
                    const parsed = JSON.parse(saved);
                    // Normalização para garantir formato de lista de statusIds
                    return parsed.map(c => ({
                        ...c,
                        statusIds: c.statusIds || (c.statusId ? [c.statusId] : ['pendente'])
                    }));
                } catch (e) {
                    return defaultColumnsConfig;
                }
            });

            const [isManageColumnsOpen, setIsManageColumnsOpen] = useState(false);
            const [editingColumn, setEditingColumn] = useState(null);

            // Histórico
            const [isHistoryOpen, setIsHistoryOpen] = useState(false);
            const [historySearchTerm, setHistorySearchTerm] = useState('');

            // Senhas
            const [passwords, setPasswords] = useState(() => {
                const saved = localStorage.getItem('ops_passwords');
                return saved ? JSON.parse(saved) : { pcp: '123456', almoxarifado: '112233', distribuicao: '334455' };
            });

            const [passwordModal, setPasswordModal] = useState({ 
                isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null 
            });

            // Form de OP
            const [formData, setFormData] = useState({
                opNumber: '', model: '', faccaoDestino: '', status: 'pendente', notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: ''
            });

            // Form de Fase
            const [phaseFormData, setPhaseFormData] = useState({
                title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: ''
            });

            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            });

            useEffect(() => {
                if (!firebaseOnline || !auth) {
                    setDbStatus('offline');
                    loadLocalData();
                    return;
                }
                auth.signInAnonymously()
                    .then(() => setIsAuthenticated(true))
                    .catch(() => { setDbStatus('offline'); loadLocalData(); });
            }, []);

            useEffect(() => {
                if (!isAuthenticated || !db) return;
                setDbStatus('conectando');
                const unsubscribe = db.collection('ops_aviamentos').onSnapshot((snapshot) => {
                    const loadedOps = [];
                    snapshot.forEach(doc => loadedOps.push({ id: doc.id, ...doc.data() }));
                    setOps(loadedOps);
                    setDbStatus('online');
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(loadedOps));
                }, () => { setDbStatus('offline'); loadLocalData(); });

                return () => unsubscribe();
            }, [isAuthenticated]);

            const loadLocalData = () => {
                const cached = localStorage.getItem('ops_aviamentos_cache');
                if (cached) setOps(JSON.parse(cached));
            };

            const saveOpToDb = (updatedOp) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(updatedOp.id).set(updatedOp)
                        .catch(() => updateLocalState(updatedOp));
                } else {
                    updateLocalState(updatedOp);
                }
            };

            const updateLocalState = (updatedOp) => {
                const exist = ops.some(o => o.id === updatedOp.id);
                const newOps = exist ? ops.map(o => o.id === updatedOp.id ? updatedOp : o) : [...ops, updatedOp];
                setOps(newOps);
                localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
            };

            const saveColumnsConfig = (newCols) => {
                setColumns(newCols);
                localStorage.setItem('ops_columns_config', JSON.stringify(newCols));
            };

            // EXPORTAÇÃO EXCEL
            const handleExportToExcel = () => {
                if (typeof XLSX === 'undefined') {
                    alert("Biblioteca Excel carregando, aguarde...");
                    return;
                }

                const dataToExport = ops.map(op => {
                    const sla = calculateSlaStatus(op.slaDeadline, op.completedTime);
                    const isFinalizada = op.status === 'completo';
                    return {
                        "Número OP": op.opNumber || '',
                        "Modelo / Referência": op.model || '',
                        "Facção Destino": op.faccaoDestino || '',
                        "Situação": isFinalizada ? "Finalizada" : "Ativa",
                        "Status Atual": op.status || '',
                        "Prioridade": op.isPriority ? "SIM" : "Não",
                        "Data Solicitação": formatDateTime(op.requestTime),
                        "Prazo SLA": formatDateTime(op.slaDeadline),
                        "Data Conclusão": formatDateTime(op.completedTime),
                        "Status SLA": sla.text,
                        "Observações": op.notes || ''
                    };
                });

                const worksheet = XLSX.utils.json_to_sheet(dataToExport);
                const workbook = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(workbook, worksheet, "Ordens");
                XLSX.writeFile(workbook, `Relatorio_OPs_${new Date().toISOString().slice(0, 10)}.xlsx`);
            };

            // BACKUP JSON GERAL
            const handleExportBackupJSON = () => {
                const backupPayload = { version: "2.2", columns, passwords, ops };
                const blob = new Blob([JSON.stringify(backupPayload, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Backup_OPs_${new Date().toISOString().slice(0, 10)}.json`;
                a.click();
            };

            const handleImportBackupJSON = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (!importedData.ops || !Array.isArray(importedData.ops)) {
                            alert("Arquivo de backup inválido!");
                            return;
                        }

                        if (confirm(`Restaurar ${importedData.ops.length} OPs?`)) {
                            setOps(importedData.ops);
                            localStorage.setItem('ops_aviamentos_cache', JSON.stringify(importedData.ops));
                            if (importedData.columns) saveColumnsConfig(importedData.columns);
                            if (importedData.passwords) {
                                setPasswords(importedData.passwords);
                                localStorage.setItem('ops_passwords', JSON.stringify(importedData.passwords));
                            }
                            if (dbStatus === 'online' && db) {
                                importedData.ops.forEach(op => db.collection('ops_aviamentos').doc(op.id).set(op));
                            }
                            alert("Restauração efetuada com sucesso!");
                        }
                    } catch (err) {
                        alert("Erro ao restaurar backup.");
                    }
                };
                reader.readAsText(file);
            };

            // REINICIALIZAR COLUNAS PADRÃO (Caso precise restaurar visão original)
            const handleResetDefaultColumns = () => {
                if (confirm("Deseja restaurar as colunas originais do sistema? Suas OPs serão re-organizadas imediatamente.")) {
                    saveColumnsConfig(defaultColumnsConfig);
                }
            };

            // GESTÃO DE COLUNAS/FASES (MOVER, EDITAR, EXCLUIR)
            const handleMoveColumn = (index, direction) => {
                const newCols = [...columns];
                const targetIndex = index + direction;
                if (targetIndex < 0 || targetIndex >= newCols.length) return;

                const temp = newCols[index];
                newCols[index] = newCols[targetIndex];
                newCols[targetIndex] = temp;

                saveColumnsConfig(newCols);
            };

            const handleStartEditColumn = (col) => {
                setEditingColumn(col);
                setPhaseFormData({
                    title: col.title,
                    sector: col.sector || 'almoxarifado',
                    statusId: (col.statusIds || [])[0] || col.id,
                    color: col.color || 'border-indigo-300 bg-indigo-50/20',
                    password: passwords[col.sector] || ''
                });
            };

            const handleSavePhase = (e) => {
                e.preventDefault();
                if (!phaseFormData.title || !phaseFormData.statusId) return;

                const statusFormatted = phaseFormData.statusId.toLowerCase().replace(/\s+/g, '_');

                if (editingColumn) {
                    const updatedCols = columns.map(c => c.id === editingColumn.id ? {
                        ...c,
                        title: phaseFormData.title,
                        statusIds: Array.from(new Set([...(c.statusIds || []), statusFormatted])),
                        sector: phaseFormData.sector,
                        color: phaseFormData.color
                    } : c);
                    saveColumnsConfig(updatedCols);
                    setEditingColumn(null);
                } else {
                    const newCol = {
                        id: `col_${Date.now()}`,
                        title: phaseFormData.title,
                        color: phaseFormData.color,
                        badgeColor: 'bg-indigo-100 text-indigo-800',
                        statusIds: [statusFormatted],
                        sector: phaseFormData.sector
                    };
                    saveColumnsConfig([...columns, newCol]);
                }

                if (phaseFormData.password) {
                    const newPasses = { ...passwords, [phaseFormData.sector]: phaseFormData.password };
                    setPasswords(newPasses);
                    localStorage.setItem('ops_passwords', JSON.stringify(newPasses));
                }

                setPhaseFormData({ title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: '' });
            };

            const handleDeleteColumn = (colId) => {
                if (columns.length <= 1) {
                    alert("Você deve manter pelo menos uma fase no Kanban.");
                    return;
                }
                if (confirm("Tem certeza que deseja excluir esta fase? As OPs continuam preservadas no banco.")) {
                    const updatedCols = columns.filter(c => c.id !== colId);
                    saveColumnsConfig(updatedCols);
                }
            };

            // MOVIMENTAÇÃO DE FASE DA OP (Avançar/Voltar)
            const handleMoveOpPhase = (op, direction) => {
                const currentIndex = columns.findIndex(c => (c.statusIds || []).includes(op.status));
                const targetIndex = currentIndex + direction;

                if (targetIndex < 0 || targetIndex >= columns.length) return;

                const targetColumn = columns[targetIndex];
                const nextStatus = targetColumn.statusIds[0];
                triggerPasswordCheck(targetColumn.sector, 'move_phase', { op, nextStatus });
            };

            const triggerPasswordCheck = (requiredRole, actionType, actionData = null) => {
                setPasswordModal({
                    isOpen: true,
                    requiredRole: requiredRole,
                    actionType: actionType,
                    password: '',
                    error: '',
                    actionData: actionData
                });
            };

            const handleVerifyPassword = (e) => {
                e.preventDefault();
                const requiredRole = passwordModal.requiredRole;
                const correctPassword = passwords[requiredRole] || '123456';

                if (passwordModal.password !== correctPassword) {
                    setPasswordModal(prev => ({ ...prev, error: `Senha do setor incorreta!` }));
                    return;
                }

                const action = passwordModal.actionType;
                const data = passwordModal.actionData;

                setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null });

                if (action === 'delete') executeDeleteOp(data.id);
                else if (action === 'move_phase') executeMovePhase(data.op, data.nextStatus);
                else if (action === 'save_op') executeSaveOp(data);
            };

            const executeDeleteOp = (opId) => {
                if (dbStatus === 'online' && db) {
                    db.collection('ops_aviamentos').doc(opId).delete().then(() => setIsModalOpen(false));
                } else {
                    const newOps = ops.filter(o => o.id !== opId);
                    setOps(newOps);
                    localStorage.setItem('ops_aviamentos_cache', JSON.stringify(newOps));
                    setIsModalOpen(false);
                }
            };

            const executeMovePhase = (opToMove, nextStatus) => {
                const updatedOp = {
                    ...opToMove,
                    status: nextStatus,
                    completedTime: nextStatus === 'completo' ? new Date().toISOString() : (opToMove.completedTime || null)
                };
                saveOpToDb(updatedOp);
                setIsModalOpen(false);
            };

            const handleOpenModal = (op = null) => {
                if (op) {
                    setEditingOp(op);
                    setFormData({
                        opNumber: op.opNumber || '',
                        model: op.model || '',
                        faccaoDestino: op.faccaoDestino || '',
                        status: op.status || (columns[0] ? columns[0].statusIds[0] : 'pendente'),
                        notes: op.notes || '',
                        slaDeadline: op.slaDeadline ? op.slaDeadline.slice(0, 16) : '',
                        isPriority: op.isPriority || false,
                        pdfBase64: op.pdfBase64 || '',
                        pdfName: op.pdfName || ''
                    });
                } else {
                    setEditingOp(null);
                    setFormData({ 
                        opNumber: '', model: '', faccaoDestino: '', 
                        status: columns[0] ? columns[0].statusIds[0] : 'pendente', 
                        notes: '', slaDeadline: '', isPriority: false, pdfBase64: '', pdfName: '' 
                    });
                }
                setIsModalOpen(true);
            };

            const handleSaveOpSubmit = (e) => {
                e.preventDefault();
                const payload = {
                    id: editingOp ? editingOp.id : `sol-${Date.now()}`,
                    opNumber: formData.opNumber,
                    model: formData.model,
                    faccaoDestino: formData.faccaoDestino,
                    status: formData.status,
                    notes: formData.notes,
                    requestTime: editingOp ? editingOp.requestTime : new Date().toISOString(),
                    slaDeadline: formData.slaDeadline ? new Date(formData.slaDeadline).toISOString() : new Date().toISOString(),
                    completedTime: formData.status === 'completo' ? new Date().toISOString() : null,
                    isPriority: formData.isPriority,
                    pdfBase64: formData.pdfBase64,
                    pdfName: formData.pdfName
                };

                const currentCol = columns.find(c => (c.statusIds || []).includes(formData.status));
                const requiredSector = currentCol ? currentCol.sector : 'pcp';
                triggerPasswordCheck(requiredSector, 'save_op', payload);
            };

            const executeSaveOp = (opToSave) => {
                saveOpToDb(opToSave);
                setIsModalOpen(false);
            };

            const isCompletedAndOld = (op) => {
                if (op.status !== 'completo' || !op.completedTime) return false;
                return (new Date().getTime() - new Date(op.completedTime).getTime()) / (1000 * 60 * 60) >= 24; 
            };

            const visibleOps = ops.filter(op => !isCompletedAndOld(op));
            const filteredOps = visibleOps.filter(op => 
                (op.opNumber || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.model || '').toLowerCase().includes(searchTerm.toLowerCase()) ||
                (op.faccaoDestino || '').toLowerCase().includes(searchTerm.toLowerCase())
            );

            const allCompletedOps = ops.filter(op => op.status === 'completo');

            return (
                <div className="min-h-screen flex flex-col">
                    {/* Header Principal */}
                    <header className="bg-white border-b border-slate-200 sticky top-0 z-10 px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-3">
                            <div className="bg-blue-600 p-2.5 rounded-xl text-white shadow-lg shadow-blue-100">
                                <i data-lucide="package" className="w-6 h-6"></i>
                            </div>
                            <div>
                                <h1 className="text-lg font-extrabold text-slate-800 leading-tight">Painel de Aviamentos</h1>
                                <p className="text-xs text-slate-400">Total no Banco: <strong>{ops.length} OPs</strong></p>
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2 items-center w-full md:w-auto justify-end">
                            <button onClick={handleExportToExcel} className="px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold shadow-sm">
                                <i data-lucide="file-spreadsheet" className="w-4 h-4"></i> Excel
                            </button>

                            <button onClick={() => setIsManageColumnsOpen(true)} className="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border border-indigo-200 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold">
                                <i data-lucide="sliders" className="w-4 h-4"></i> Configurar Fases
                            </button>

                            <button onClick={handleExportBackupJSON} className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold">
                                <i data-lucide="download" className="w-4 h-4"></i> Backup
                            </button>

                            <label className="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition-all flex items-center gap-1.5 text-xs font-bold cursor-pointer">
                                <i data-lucide="upload" className="w-4 h-4"></i> Restaurar
                                <input type="file" accept=".json" onChange={handleImportBackupJSON} className="hidden" />
                            </label>

                            <button onClick={() => setIsHistoryOpen(true)} className="px-3 py-2 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 rounded-xl text-emerald-800 transition-all flex items-center gap-1.5 text-xs font-bold">
                                <i data-lucide="history" className="w-4 h-4"></i> Histórico ({allCompletedOps.length})
                            </button>

                            <div className="relative w-full md:w-48">
                                <i data-lucide="search" className="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
                                <input type="text" placeholder="Buscar OP..." className="pl-9 pr-4 py-2 border border-slate-200 bg-slate-50 rounded-lg text-xs outline-none w-full" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                            </div>
                            
                            <button onClick={() => handleOpenModal()} className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 shadow-sm">
                                <i data-lucide="plus" className="w-4 h-4"></i> Nova OP
                            </button>
                        </div>
                    </header>

                    {/* Kanban Board Dinâmico e Compatível */}
                    <main className="flex-1 p-6 flex flex-col">
                        <div className="flex-1 overflow-x-auto pb-4 custom-scrollbar">
                            <div className="flex gap-6 h-full items-start min-w-[1280px]">
                                {columns.map((col) => {
                                    const colOps = filteredOps.filter(op => (col.statusIds || []).includes(op.status));
                                    return (
                                        <div key={col.id} className={`w-80 flex flex-col border rounded-2xl h-[calc(100vh-180px)] min-h-[480px] ${col.color}`}>
                                            <div className="p-3 border-b border-slate-200 flex justify-between items-center bg-white/80 rounded-t-2xl">
                                                <div className="flex items-center gap-2">
                                                    <h3 className="font-bold text-slate-700 text-xs">{col.title}</h3>
                                                </div>
                                                <span className={`text-[10px] py-0.5 px-2 rounded-full font-bold ${col.badgeColor}`}>{colOps.length}</span>
                                            </div>

                                            <div className="p-3 overflow-y-auto flex-1 custom-scrollbar">
                                                {colOps.map(op => (
                                                    <div key={op.id} onClick={() => handleOpenModal(op)} className="bg-white p-4 rounded-xl shadow-sm border mb-3 cursor-pointer hover:shadow-md transition-all">
                                                        <div className="flex justify-between items-start mb-1">
                                                            <h4 className="font-bold text-slate-800 text-sm">{op.opNumber}</h4>
                                                            {op.isPriority && <span className="bg-amber-100 text-amber-800 text-[10px] font-bold px-1.5 rounded">PRIORIDADE</span>}
                                                        </div>
                                                        <p className="text-xs font-semibold text-slate-600">{op.model}</p>
                                                        <p className="text-[11px] text-slate-500 mt-1"><i data-lucide="truck" className="w-3 h-3 inline"></i> {op.faccaoDestino}</p>
                                                    </div>
                                                ))}
                                                {colOps.length === 0 && (
                                                    <div className="text-center py-12 text-slate-400 text-xs border-2 border-dashed border-slate-200/80 rounded-xl">
                                                        Nenhuma OP nesta fase
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </main>

                    {/* Modal Detalhes / Edição / Avanço de Fase da OP */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg p-6 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-bold text-slate-800 text-sm">{editingOp ? `Editar OP: ${editingOp.opNumber}` : 'Nova OP'}</h3>
                                    <button onClick={() => setIsModalOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                {editingOp && (
                                    <div className="p-3 bg-slate-50 border rounded-xl flex justify-between items-center gap-2">
                                        <button 
                                            type="button"
                                            onClick={() => handleMoveOpPhase(editingOp, -1)}
                                            className="px-3 py-1.5 bg-white border text-slate-700 rounded-lg text-xs font-bold hover:bg-slate-100 flex items-center gap-1"
                                        >
                                            <i data-lucide="arrow-left" className="w-3.5 h-3.5"></i> Voltar Fase
                                        </button>
                                        <span className="text-xs font-bold text-indigo-600 uppercase">Fase: {formData.status}</span>
                                        <button 
                                            type="button"
                                            onClick={() => handleMoveOpPhase(editingOp, 1)}
                                            className="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold hover:bg-indigo-700 flex items-center gap-1 shadow-sm"
                                        >
                                            Avançar Fase <i data-lucide="arrow-right" className="w-3.5 h-3.5"></i>
                                        </button>
                                    </div>
                                )}

                                <form onSubmit={handleSaveOpSubmit} className="space-y-3">
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Número da OP *</label>
                                        <input type="text" required placeholder="Ex: OP-123" className="w-full p-2 border rounded-xl text-xs" value={formData.opNumber} onChange={e => setFormData({...formData, opNumber: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Modelo / Referência *</label>
                                        <input type="text" required placeholder="Ex: Camisa Polo" className="w-full p-2 border rounded-xl text-xs" value={formData.model} onChange={e => setFormData({...formData, model: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Facção de Destino *</label>
                                        <input type="text" required placeholder="Ex: Oficina Externa" className="w-full p-2 border rounded-xl text-xs" value={formData.faccaoDestino} onChange={e => setFormData({...formData, faccaoDestino: e.target.value})} />
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Fase / Status Atual</label>
                                        <select className="w-full p-2 border rounded-xl text-xs" value={formData.status} onChange={e => setFormData({...formData, status: e.target.value})}>
                                            {columns.map(c => <option key={c.id} value={c.statusIds[0]}>{c.title}</option>)}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="text-xs font-bold text-slate-600 block mb-1">Observações</label>
                                        <textarea rows="2" className="w-full p-2 border rounded-xl text-xs" value={formData.notes} onChange={e => setFormData({...formData, notes: e.target.value})}></textarea>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-2">
                                        {editingOp && (
                                            <button type="button" onClick={() => triggerPasswordCheck('pcp', 'delete', editingOp)} className="px-3 py-2 bg-red-600 text-white font-bold rounded-xl text-xs">Excluir</button>
                                        )}
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white font-bold rounded-xl text-xs">Salvar Registro</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Gerenciador de Fases (Reordenar, Editar, Resetar e Criar) */}
                    {isManageColumnsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl p-6 flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Gerenciador de Fases do Kanban</h3>
                                    <button onClick={() => setIsManageColumnsOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>

                                <div className="mb-3 text-right">
                                    <button onClick={handleResetDefaultColumns} className="text-xs font-bold text-red-600 underline hover:text-red-800">
                                        Restaurar Estrutura de Colunas Padrão
                                    </button>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 overflow-y-auto flex-1">
                                    {/* Lista de Fases Existentes */}
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-slate-600 uppercase">Fases Atuais (Ordem no Kanban)</h4>
                                        {columns.map((col, idx) => (
                                            <div key={col.id} className="p-3 border rounded-xl bg-slate-50 flex items-center justify-between gap-2">
                                                <div className="flex-1">
                                                    <p className="font-bold text-xs text-slate-800">{col.title}</p>
                                                    <p className="text-[10px] text-slate-500">Setor: {col.sector}</p>
                                                </div>
                                                <div className="flex items-center gap-1">
                                                    <button onClick={() => handleMoveColumn(idx, -1)} disabled={idx === 0} className="p-1 text-slate-600 hover:bg-slate-200 rounded disabled:opacity-30">
                                                        <i data-lucide="arrow-left" className="w-4 h-4"></i>
                                                    </button>
                                                    <button onClick={() => handleMoveColumn(idx, 1)} disabled={idx === columns.length - 1} className="p-1 text-slate-600 hover:bg-slate-200 rounded disabled:opacity-30">
                                                        <i data-lucide="arrow-right" className="w-4 h-4"></i>
                                                    </button>
                                                    <button onClick={() => handleStartEditColumn(col)} className="p-1 text-blue-600 hover:bg-blue-50 rounded">
                                                        <i data-lucide="edit-2" className="w-4 h-4"></i>
                                                    </button>
                                                    <button onClick={() => handleDeleteColumn(col.id)} className="p-1 text-red-600 hover:bg-red-50 rounded">
                                                        <i data-lucide="trash-2" className="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    {/* Form para Criar/Editar Fase */}
                                    <form onSubmit={handleSavePhase} className="space-y-3 bg-slate-50 p-4 border rounded-xl">
                                        <h4 className="text-xs font-bold text-indigo-700 uppercase">
                                            {editingColumn ? 'Editar Fase Selecionada' : 'Criar Nova Fase'}
                                        </h4>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Título da Coluna *</label>
                                            <input type="text" required placeholder="Ex: Qualidade" className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.title} onChange={e => setPhaseFormData({...phaseFormData, title: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">ID do Status Interno *</label>
                                            <input type="text" required placeholder="Ex: em_qualidade" className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.statusId} onChange={e => setPhaseFormData({...phaseFormData, statusId: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Setor Responsável *</label>
                                            <select className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.sector} onChange={e => setPhaseFormData({...phaseFormData, sector: e.target.value})}>
                                                <option value="pcp">PCP</option>
                                                <option value="almoxarifado">Almoxarifado</option>
                                                <option value="distribuicao">Distribuição</option>
                                                <option value="qualidade">Qualidade</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-slate-600 block mb-1">Senha do Setor</label>
                                            <input type="password" placeholder="Digite para alterar..." className="w-full p-2 border rounded-xl text-xs bg-white" value={phaseFormData.password} onChange={e => setPhaseFormData({...phaseFormData, password: e.target.value})} />
                                        </div>
                                        <div className="flex gap-2 pt-2">
                                            {editingColumn && (
                                                <button type="button" onClick={() => { setEditingColumn(null); setPhaseFormData({ title: '', sector: 'almoxarifado', statusId: '', color: 'border-indigo-300 bg-indigo-50/20', password: '' }); }} className="flex-1 py-2 bg-slate-200 text-slate-700 font-bold rounded-xl text-xs">Cancelar</button>
                                            )}
                                            <button type="submit" className="flex-1 py-2 bg-indigo-600 text-white font-bold rounded-xl text-xs">
                                                {editingColumn ? 'Salvar Fase' : 'Adicionar Fase'}
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modal Validação de Senha */}
                    {passwordModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-5 space-y-4 border">
                                <h3 className="text-xs font-extrabold text-slate-800 uppercase">Validação de Senha ({passwordModal.requiredRole})</h3>
                                <form onSubmit={handleVerifyPassword} className="space-y-3">
                                    <input type="password" required autoFocus placeholder="Digite a senha..." className="w-full p-2.5 border rounded-xl text-center text-sm font-bold" value={passwordModal.password} onChange={e => setPasswordModal({ ...passwordModal, password: e.target.value })} />
                                    {passwordModal.error && <p className="text-[11px] text-red-600 font-bold text-center">{passwordModal.error}</p>}
                                    <div className="flex gap-2">
                                        <button type="button" onClick={() => setPasswordModal({ isOpen: false, requiredRole: 'pcp', actionType: '', password: '', error: '', actionData: null })} className="flex-1 py-2 border rounded-xl text-xs font-bold">Cancelar</button>
                                        <button type="submit" className="flex-1 py-2 bg-slate-800 text-white rounded-xl text-xs font-bold">Validar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Modal Histórico */}
                    {isHistoryOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl p-6 flex flex-col h-[80vh]">
                                <div className="flex justify-between items-center border-b pb-3 mb-4">
                                    <h3 className="font-bold text-slate-800 text-sm">Histórico de OPs Finalizadas ({allCompletedOps.length})</h3>
                                    <button onClick={() => setIsHistoryOpen(false)}><i data-lucide="x" className="w-5 h-5"></i></button>
                                </div>
                                <div className="flex justify-between items-center mb-4">
                                    <input type="text" placeholder="Pesquisar..." className="p-2 border rounded-xl text-xs w-64" value={historySearchTerm} onChange={e => setHistorySearchTerm(e.target.value)} />
                                    <button onClick={handleExportToExcel} className="px-3 py-1.5 bg-emerald-600 text-white rounded-xl font-bold text-xs"><i data-lucide="file-spreadsheet" className="w-4 h-4 inline"></i> Baixar Excel</button>
                                </div>
                                <div className="flex-1 overflow-y-auto space-y-2">
                                    {allCompletedOps.map(op => (
                                        <div key={op.id} className="p-3 border rounded-xl flex justify-between items-center text-xs">
                                            <div>
                                                <p className="font-bold">{op.opNumber} - {op.model}</p>
                                                <p className="text-slate-500">Destino: {op.faccaoDestino}</p>
                                            </div>
                                            <span className="bg-emerald-100 text-emerald-800 font-bold px-2 py-1 rounded">Entregue</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
